<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCOACH-MyTEAM｜地域クラブ運営コンソール（デモ）</title>
<meta name="theme-color" content="#0F2A4A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" media="print" onload="this.media='all'">
<style>
:root{--navy:#0F2A4A;--navy2:#16365E;--blue:#2E7CE0;--blue-l:#E8F1FC;--lime:#B7F03C;--orange:#FF8A3D;--yellow:#F5C400;--red:#E5484D;--green:#2BB673;--ink:#14202E;--sub:#5B6B80;--line:#E3E9F1;--bg:#F3F6FA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit}
.layout{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.layout>div,.grid>*{min-width:0}
aside{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:900;font-size:16px;padding:0 8px 4px}
.brand b{color:var(--lime)}
.club{font-size:12px;opacity:.7;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.navb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
.navb:hover{opacity:1;background:rgba(255,255,255,.06)}
.navb.on{opacity:1;background:rgba(183,240,60,.14);color:var(--lime);font-weight:700}
.navb .bd{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.aside-ft{position:absolute;bottom:16px;left:14px;right:14px;font-size:11px;opacity:.6}
.aside-ft a{color:#fff}
main{padding:28px 32px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:900}
.top p{color:var(--sub);font-size:13px}
.demo-badge{background:#FFF4E5;color:#9A4B00;border:1px solid #FFD9A8;font-size:12px;border-radius:8px;padding:6px 10px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
.kpi .lbl{font-size:12px;color:var(--sub)}
.kpi .val{font-size:28px;font-weight:900;line-height:1.3}
.kpi .val small{font-size:13px;font-weight:500;color:var(--sub)}
.kpi .sub{font-size:12px;color:var(--sub)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ok{background:#E3F7EC;color:#167A49}.warn{background:#FFF1E0;color:#B45309}.ng{background:#FDE8E8;color:#B42318}.info{background:var(--blue-l);color:#1C5FB8}.mute{background:#EEF1F5;color:var(--sub)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:500}
td.num,th.num{text-align:right}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}
.b-pri{background:var(--navy);color:#fff}.b-pri:hover{background:var(--navy2)}
.b-lime{background:var(--lime);color:var(--navy)}
.b-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.b-sm{padding:5px 10px;font-size:12px}
.field{display:grid;gap:4px;font-size:12px;color:var(--sub)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.hide{display:none!important}
.score{font-size:26px;font-weight:900;color:var(--blue);line-height:1}
.coach{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.coach:last-child{border-bottom:0}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px}
.why{font-size:12px;color:var(--sub);margin-top:4px}
.why span{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 7px;margin:2px 4px 0 0}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
/* WBGT */
.wbgt-now{display:flex;gap:18px;align-items:center}
.wbgt-num{font-size:56px;font-weight:900;line-height:1}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.hr{border-radius:8px;padding:6px 4px;text-align:center;font-size:11px;color:#14202E}
.hr b{display:block;font-size:15px}
.hr.act{outline:3px solid var(--navy);outline-offset:-3px}
.lv0{background:#D6ECFF}.lv1{background:#CFF3C9}.lv2{background:#FFF0A6}.lv3{background:#FFC999}.lv4{background:#FF9B9B}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:10px}
.legend span{padding:2px 8px;border-radius:6px}
/* chart */
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.chart i{flex:1;background:var(--blue);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart i.hi{background:var(--orange)}.chart i.vh{background:var(--red)}
.chart-x{display:flex;gap:4px;font-size:10px;color:var(--sub)}.chart-x span{flex:1;text-align:center}
.menu-out{background:var(--bg);border-radius:12px;padding:14px;margin-top:12px}
.menu-out .blk{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.menu-out .blk:last-child{border-bottom:0}
.menu-out .blk b{color:var(--blue)}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.alert.ng{border:1px solid #F7C1C1}.alert.warn{border:1px solid #FFD9A8}.alert.info{border:1px solid #C8DDF7}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw}
.toast.on{opacity:1}
dialog{border:0;border-radius:16px;padding:22px;max-width:560px;width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,42,74,.45)}
dialog textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.mobile-nav{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .mobile-nav{display:flex;overflow-x:auto;gap:6px;background:var(--navy);padding:10px;position:sticky;top:0;z-index:20}
  .mobile-nav .navb{white-space:nowrap;width:auto;padding:8px 12px}
  main{padding:18px 14px 60px}
  .g4{grid-template-columns:1fr 1fr}.g3,.g2,.g21{grid-template-columns:1fr}
  .tbl-wrap{overflow-x:auto}
}
@media print{aside,.mobile-nav,.noprint,.demo-badge{display:none!important}.layout{display:block}main{padding:0}.card{break-inside:avoid}body{background:#fff}}

/* ===== motion & swipe ===== */
@keyframes up{from{opacity:0;transform:translateY(14px)}}
main>.top,main>.grid>*,main>.card{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
main>.grid>*:nth-child(2){animation-delay:.05s}main>.grid>*:nth-child(3){animation-delay:.1s}main>.grid>*:nth-child(4){animation-delay:.15s}
main>.grid:nth-of-type(2)>*{animation-delay:.12s}
.card{transition:box-shadow .3s,transform .3s}
@media (hover:hover){.card:hover{box-shadow:0 10px 28px rgba(15,42,74,.08)}}
.btn{transition:transform .12s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.navb{transition:background .2s,color .2s,opacity .2s}
.chart i{transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.chart i:nth-child(n){animation-delay:calc(var(--i,0)*60ms)}
@keyframes grow{from{transform:scaleY(0)}}
.bar i{animation:barIn .9s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes barIn{from{transform:scaleX(0)}}
.hr{animation:up .4s both;transition:transform .2s}
@media (hover:hover){.hr:hover{transform:translateY(-3px)}}
.coach{animation:up .45s both}
.coach:nth-child(3){animation-delay:.05s}.coach:nth-child(4){animation-delay:.1s}.coach:nth-child(5){animation-delay:.15s}.coach:nth-child(6){animation-delay:.2s}.coach:nth-child(7){animation-delay:.25s}
.alert{animation:up .45s both}
.alert a{display:inline-block;white-space:nowrap;font-weight:700;color:inherit;text-decoration:none;border-bottom:2px solid currentColor;line-height:1.3;margin-left:2px}
.alert a:after{content:" ›"}
.skel{display:inline-block;height:1em;width:3.2em;border-radius:6px;background:linear-gradient(90deg,#E8EDF3 25%,#F5F7FA 50%,#E8EDF3 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;vertical-align:middle}
@keyframes shimmer{to{background-position:-200% 0}}
.toast{transform:translate(-50%,20px)}
.toast.on{transform:translate(-50%,0);transition:.3s cubic-bezier(.2,.7,.2,1)}
dialog[open]{animation:dlgIn .3s cubic-bezier(.2,.7,.2,1)}
@keyframes dlgIn{from{opacity:0;transform:translateY(20px) scale(.97)}}
::view-transition-old(root){animation:vtOut .18s ease both}
::view-transition-new(root){animation:vtIn .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes vtOut{to{opacity:0}}@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}
.mtop{display:none}
.sw-dots{display:none}
@media (max-width:980px){
  .mtop{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20}
  .mtop b{font-weight:900}.mtop b em{font-style:normal;color:var(--lime)}
  .mtop small{display:block;font-size:11px;opacity:.7}
  .mobile-nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);overflow:visible}
  .mobile-nav .navb{flex-direction:column;gap:2px;padding:6px 2px;color:var(--sub);opacity:1;font-size:10px;border-radius:12px;justify-content:center;position:relative;width:100%}
  .mobile-nav .navb .ic{font-size:20px;line-height:1;transition:transform .25s}
  .mobile-nav .navb .lb-l{display:none}
  .mobile-nav .navb.on{background:var(--blue-l);color:var(--blue);font-weight:700}
  .mobile-nav .navb.on .ic{transform:translateY(-2px) scale(1.1)}
  .mobile-nav .navb .bd{position:absolute;top:2px;right:18%;margin:0;font-size:10px}
  main{padding:16px 14px 110px}
  .demo-badge{font-size:11px}
  .grid.g4,.grid.g3{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:14px;gap:12px;margin:0 -14px;padding:2px 14px 6px;scrollbar-width:none}
  .grid.g4::-webkit-scrollbar,.grid.g3::-webkit-scrollbar{display:none}
  .grid.g4>*,.grid.g3>*{flex:0 0 72%;scroll-snap-align:start}
  .g4 + .sw-dots,.g3 + .sw-dots{display:flex;justify-content:center;gap:5px;margin:6px 0 4px}
  .sw-dots i{width:6px;height:6px;border-radius:9px;background:#CBD5E1;transition:.3s}.sw-dots i.on{width:18px;background:var(--blue)}
  .hours{display:flex;overflow-x:auto;scroll-snap-type:x proximity;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .hours .hr{flex:0 0 62px;scroll-snap-align:start}
  .coach{grid-template-columns:44px 1fr auto;gap:10px}
  .av{width:44px;height:44px;font-size:15px}
  .score{font-size:22px}
  dialog{position:fixed;margin:auto auto 0;max-width:none;width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  dialog[open]{animation:sheetIn .35s cubic-bezier(.2,.7,.2,1)}
  @keyframes sheetIn{from{transform:translateY(100%)}}
  .toast{bottom:90px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">My<b>COACH</b>-My<b>TEAM</b></div>
    <div class="club" id="clubName"></div>
    <div id="navList"></div>
    <div class="aside-ft">デモ版：データはこのブラウザ内だけに保存されます<br><a href="#" onclick="resetDemo();return false">デモデータを初期化</a>　<a href="index.html">サービス紹介へ</a></div>
  </aside>
  <div>
    <div class="mtop"><div><b>My<em>COACH</em>-My<em>TEAM</em></b><small id="clubNameM"></small></div><a href="index.html" style="color:#fff;font-size:12px;opacity:.8">サービス紹介</a></div>
    <div class="mobile-nav" id="navMobile"></div>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><h3 id="dlgT" style="font-size:16px"></h3><div id="dlgB"></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn b-line" onclick="dlg.close()">閉じる</button><button class="btn b-pri hide" id="dlgOk"></button></div></dialog>

<script>
/* =====================================================================
   MyCOACH-MyTEAM 地域クラブ運営コンソール（スタンドアロンデモ）
   - 指導者マッチング：条件にもとづくマッチ度スコア（理由つき）
   - 安全管理：Open-Meteoの予報から暑さ指数（WBGT）を推定（環境省採用の推定式）
   - 練習・コンディション：RPE×時間の練習負荷、直近7日/28日の負荷比（ACWR）
   - 事務自動化：会費の回収・減免・督促文、出欠、自治体向け実績報告（CSV）
   本番接続時は Firestore（firestore.rules）と Cloud Functions（functions/）に置き換える
   ===================================================================== */

/* 任意：生成AIで練習メニューを作る場合のエンドポイント（Cloud Functions等）。空なら内蔵ロジックで作成 */
const AI_MENU_ENDPOINT = '';

const KEY = 'mcmt_demo_v2';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const DOW = ['日','月','火','水','木','金','土'];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- シードデータ ---------- */
function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function seed(){
  const r = rng(42);
  const club = { name:'中野区 地域バスケットボールクラブ', sport:'バスケットボール', area:'東京都中野区', lat:35.7074, lon:139.6638,
    venue:'中野区立 江原小学校 体育館', outdoorVenue:'富士見グラウンド', days:[6,0], fee:3000, needLicense:true };
  const coaches = [
    {id:'c1',name:'佐藤 健太',sport:'バスケットボール',lat:35.715,lon:139.650,days:[6,0,3],license:'JSPO公認コーチ1',verified:true,training:true,rating:4.8,count:126,teacher:false,color:'#2E7CE0'},
    {id:'c2',name:'山田 美咲',sport:'バスケットボール',lat:35.690,lon:139.700,days:[6],license:'元実業団選手',verified:true,training:true,rating:4.9,count:88,teacher:false,color:'#E5484D'},
    {id:'c3',name:'鈴木 大輔',sport:'バスケットボール',lat:35.712,lon:139.655,days:[6,0],license:'JSPO公認スタートコーチ',verified:true,training:false,rating:4.5,count:40,teacher:true,color:'#2BB673'},
    {id:'c4',name:'高橋 翔',sport:'バスケットボール',lat:35.760,lon:139.600,days:[0,2],license:'',verified:false,training:false,rating:4.2,count:12,teacher:false,color:'#9B5DE5'},
    {id:'c5',name:'伊藤 さくら',sport:'バスケットボール',lat:35.705,lon:139.680,days:[6,0,5],license:'JSPO公認コーチ3',verified:true,training:true,rating:4.7,count:210,teacher:false,color:'#FF8A3D'},
    {id:'c6',name:'渡辺 隼',sport:'サッカー',lat:35.708,lon:139.665,days:[6,0],license:'JFA C級',verified:true,training:true,rating:4.9,count:150,teacher:false,color:'#0F2A4A'},
    {id:'c7',name:'中村 遥',sport:'バレーボール',lat:35.700,lon:139.640,days:[6],license:'JSPO公認コーチ1',verified:true,training:true,rating:4.6,count:64,teacher:true,color:'#00A6A6'},
    {id:'c8',name:'小林 拓海',sport:'バスケットボール',lat:35.650,lon:139.560,days:[6,0],license:'JSPO公認コーチ1',verified:true,training:true,rating:4.4,count:30,teacher:false,color:'#6C757D'},
  ];
  const names = ['田中 陽向','加藤 結衣','吉田 蓮','山口 葵','松本 湊','井上 凛','木村 悠真','林 心春','清水 大和','森 結菜','池田 颯','橋本 芽依'];
  const members = names.map((n,i)=>({ id:'m'+(i+1), name:n, grade:'中学'+(1+(i%3))+'年', guardian:n.split(' ')[0]+' 様',
    discount: i===3?50:(i===7||i===10)?100:0 }));
  // 過去8週の活動（土日）
  const sessions = []; const att = {}; const loads = {};
  for(let d=56; d>=1; d--){
    const day = addDays(TODAY,-d);
    if(!club.days.includes(day.getDay())) continue;
    const id='s'+iso(day);
    sessions.push({id,date:iso(day),start:'09:00',min:150,coach:d%14<7?'c1':'c5',venue:club.venue,status:'done'});
    att[id] = members.filter(()=>r()>0.15).map(m=>m.id);
  }
  // 今後2週の予定
  for(let d=0; d<=14; d++){
    const day = addDays(TODAY,d);
    if(!club.days.includes(day.getDay())) continue;
    sessions.push({id:'s'+iso(day),date:iso(day),start: day.getDay()===0?'13:00':'09:00',min:150,coach:'c1',venue: day.getDay()===0?club.outdoorVenue:club.venue,status:'plan'});
  }
  // 練習負荷ログ（RPE×分）
  members.forEach((m,i)=>{
    loads[m.id]=[];
    sessions.filter(s=>s.status==='done' && att[s.id].includes(m.id)).forEach(s=>{
      const daysAgo = (TODAY - new Date(s.date))/864e5;
      let rpe = 4 + Math.round(r()*2);
      if(i===0 && daysAgo<=7) rpe = 8;               // 田中さん：直近で急増
      if(i===4 && daysAgo<=7) rpe = 7;
      loads[m.id].push({date:s.date,rpe,min: (i===0 && daysAgo<=7)?210:s.min,sleep: (i===0&&daysAgo<=7)?5.5:6.5+Math.round(r()*2*10)/10,fatigue: (i===0&&daysAgo<=7)?4:2});
    });
    // 自主練（平日）を一部追加
    if(i===0){ [2,4,5].forEach(k=>loads[m.id].push({date:iso(addDays(TODAY,-k)),rpe:7,min:90,sleep:5.5,fatigue:4})); }
  });
  // 会費（当月・前月）
  const ym = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const thisM = ym(TODAY), prevM = ym(new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1));
  const fees = {};
  [prevM,thisM].forEach(mo=>{ fees[mo]={}; members.forEach((m,i)=>{
    const due = club.fee*(100-m.discount)/100;

/* ---------- 共通計算 ---------- */
function km(a,b,c,d){ const R=6371,toR=x=>x*Math.PI/180; const dl=toR(c-a),dn=toR(d-b); const h=Math.sin(dl/2)**2+Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function matchScore(c, club, opt){
  if(c.sport!==club.sport) return null;
  const dist = km(club.lat,club.lon,c.lat,c.lon);
  const overlap = club.days.filter(d=>c.days.includes(d)).length/club.days.length;
  const parts = [
    {k:'距離',v: Math.max(0,1-dist/12)*25, note:`${dist.toFixed(1)}km`},
    {k:'曜日',v: overlap*25, note: overlap===1?'活動日すべて可':overlap>0?'一部の活動日のみ':'活動日と合わない'},
    {k:'資格',v: c.license?(c.license.includes('JSPO')||c.license.includes('JFA')?15:10):0, note:c.license||'資格なし'},
    {k:'審査',v: (c.verified?10:0)+(c.training?10:0), note:`${c.verified?'本人確認済':'本人確認未'}・${c.training?'安全研修済':'安全研修未'}`},
    {k:'評価',v: (c.rating-4)/1*10 + Math.min(c.count,150)/150*5, note:`★${c.rating}（${c.count}回）`},
  ];
  let score = parts.reduce((a,p)=>a+p.v,0);
  if(opt.requireVerified && !(c.verified&&c.training)) score -= 30;
  if(opt.preferTeacher && c.teacher) score += 5;
  return {score: Math.max(0,Math.min(100,Math.round(score))), parts, dist};
}
function wbgtLevel(w){
  if(w>=31) return {lv:4,label:'運動は原則中止',cls:'ng',advice:'特別な場合以外は運動を中止。特に子どもの場合は中止すべき。'};
  if(w>=28) return {lv:3,label:'厳重警戒',cls:'ng',advice:'激しい運動や持久走は避ける。10〜20分おきに休憩と水分・塩分補給。'};
  if(w>=25) return {lv:2,label:'警戒',cls:'warn',advice:'積極的に休憩をとり、水分・塩分を補給。激しい運動では30分おきくらいに休憩。'};
  if(w>=21) return {lv:1,label:'注意',cls:'info',advice:'熱中症の兆候に注意し、運動の合間に積極的に水分・塩分を補給。'};
  return {lv:0,label:'ほぼ安全',cls:'ok',advice:'通常は熱中症の危険は小さいが、適宜水分・塩分を補給。'};
}
/* 環境省 熱中症予防情報サイトで用いられる推定式（小野ら）: Ta[℃], RH[%], SR[kW/m2], WS[m/s] */
function estWBGT(Ta,RH,SR,WS){ return 0.735*Ta + 0.0374*RH + 0.00292*Ta*RH + 7.619*SR - 4.557*SR*SR - 0.0572*WS - 4.064; }
function acwr(mid){
  const logs = S.loads[mid]||[];
  const sum = (from,to)=>logs.filter(l=>{const a=(TODAY-new Date(l.date))/864e5; return a>=from && a<to;}).reduce((t,l)=>t+l.rpe*l.min,0);
  const acute = sum(0,7), chronic = sum(0,28)/4;
  const last = logs.filter(l=>(TODAY-new Date(l.date))/864e5<7);
  const sleep = last.length? last.reduce((t,l)=>t+l.sleep,0)/last.length : null;
  const ratio = chronic? acute/chronic : 0;
  let st = {cls:'ok',label:'良好'};
  if(ratio>1.5 || (sleep && sleep<6)) st={cls:'ng',label:'要注意'};
  else if(ratio>1.3 || ratio<0.8 && acute>0) st={cls:'warn',label:'確認'};
  if(acute===0) st={cls:'mute',label:'記録なし'};
  return {acute,chronic,ratio,sleep,st};
}
function weeklyLoads(mid){ const w=[]; for(let k=7;k>=0;k--){ w.push((S.loads[mid]||[]).filter(l=>{const a=(TODAY-new Date(l.date))/864e5; return a>=k*7 && a<(k+1)*7;}).reduce((t,l)=>t+l.rpe*l.min,0)); } return w; }

/* ---------- 天気（Open-Meteo） ---------- */
let WX = {status:'idle', hours:[], src:'', simulate:false};
async function loadWeather(){
  WX.status='loading';
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${S.club.lat}&longitude=${S.club.lon}&hourly=temperature_2m,relative_humidity_2m,shortwave_radiation,wind_speed_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=3`;
    const r = await fetch(u); if(!r.ok) throw 0; const j = await r.json(); const h=j.hourly;
    WX.hours = h.time.map((t,i)=>({t, Ta:h.temperature_2m[i], RH:h.relative_humidity_2m[i], SR:(h.shortwave_radiation[i]||0)/1000, WS:h.wind_speed_10m[i]}));
    WX.src='Open-Meteo（予報）'; WX.status='ok';
  }catch(e){ WX.status='fail'; WX.src='取得できませんでした'; WX.hours=[]; }
  if(cur==='safety'||cur==='dash') go(cur);
}
function summerSample(){ // 真夏日のサンプル（気象データ取得不可時や季節外の確認用）
  const base = iso(TODAY); const out=[];
  for(let h=0;h<24;h++){ const Ta=27+7*Math.sin((h-9)/24*2*Math.PI)+ (h>=10&&h<=15?1.5:0); const SR=Math.max(0,Math.sin((h-5)/14*Math.PI))*0.85; out.push({t:`${base}T${String(h).padStart(2,'0')}:00`,Ta,RH:68-(Ta-27)*2,SR,WS:2}); }
  return out;
}
function wxHours(indoor){
  const src = WX.simulate || WX.status!=='ok' ? summerSample() : WX.hours;
  return src.map(h=>{ const w = indoor? estWBGT(h.Ta,h.RH,0,0) : estWBGT(h.Ta,h.RH,h.SR,h.WS); return {...h, w: Math.round(w*10)/10}; });
}

async function makeMenu(){
  const goal=pG.value, T=+pT.value, N=+pN.value, W=+pW.value; const L=wbgtLevel(W);
  if(AI_MENU_ENDPOINT){
    try{ const r=await fetch(AI_MENU_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sport:S.club.sport,goal,minutes:T,players:N,wbgt:W})}); if(r.ok){ const j=await r.json(); if(j.html){COND.menu=j.html; menuOut.innerHTML=j.html; return;} } }catch(e){}
  }
  const LIB = {
    '基礎技術（ドリブル・パス）':['ハンドリング（その場・移動）','2人組パス（チェスト・バウンド・オーバーヘッド）','ジグザグドリブル→レイアップ','3対2のパス回し'],
    'シュート力の向上':['フォームシュート（ゴール下）','ミドルレンジの5か所シュート','キャッチ＆シュート（パスから）','シュート競争（チーム対抗）'],
    'ディフェンス強化':['ディフェンスのフットワーク','1対1（ボールマン・ディフェンス）','ヘルプディフェンスの位置どり','3対3（守備の約束事を確認）'],
    '試合形式・実戦':['速攻の3対2・2対1','セットオフェンスの確認','5対5（時間区切り）','振り返り（良かった点・次の課題）'],
    '体力づくり':['ダイナミックストレッチ','ラダー・アジリティ','シャトルラン（距離調整）','体幹トレーニング'],
  };
  const hot = L.lv>=2, vhot=L.lv>=3;
  const warm=15, cool=10; let main=T-warm-cool;
  const breaks = vhot? Math.floor(main/15) : hot? Math.floor(main/30) : Math.floor(main/45);
  const brMin = vhot?5:3; main -= breaks*brMin;
  const drills = LIB[goal]; const per = Math.floor(main/drills.length);
  const grp = N>16? `${Math.ceil(N/8)}グループ（8人前後）に分けて回す`: N>8? '2グループに分けて回す':'全員で実施';
  let t=0; const blk=[]; const push=(m,txt)=>{blk.push(`<div class="blk"><b>${t}〜${t+m}分</b><div>${txt}</div></div>`); t+=m;};
  push(warm,'ウォームアップ：ジョグ・ダイナミックストレッチ・軽いボールハンドリング');
  drills.forEach((d,i)=>{ const intense = vhot && /1対1|シャトル|速攻|5対5/.test(d); push(per, d + (intense?'　<span class="pill warn">強度を下げて短く</span>':'')); if(i<breaks && breaks>0) push(brMin,'休憩：水分・塩分補給（日陰・風通しのよい場所で）'); });
  push(T-t,'クールダウン：静的ストレッチ・振り返り・体調チェック（RPE入力）');
  COND.menu = `<div class="menu-out"><div style="margin-bottom:6px"><b>${esc(goal)}／${T}分／${N}人</b>　${grp}　<span class="pill ${L.cls}">暑さ指数：${L.label}</span></div>${vhot?`<div class="alert ng">🌡️ <div>厳重警戒の条件です。激しい運動は避け、${brMin}分の休憩を約15分おきに入れています。</div></div>`:hot?'<div class="alert warn">🌡️ <div>警戒の条件のため、休憩を約30分おきに入れています。</div></div>':''}${blk.join('')}<p style="font-size:11px;color:var(--sub);margin-top:8px">※自動で作成した案です。選手の状態を見て、指導者が調整してください。</p></div>`;
  menuOut.innerHTML = COND.menu;
}

      <tr><td>活動時間の合計</td><td>${hours.toFixed(1)}時間</td></tr>
      <tr><td>登録会員数／延べ参加人数</td><td>${S.members.length}人／<b>${part}人</b>（1回あたり平均 ${ss.length?(part/ss.length).toFixed(1):0}人）</td></tr>
      <tr><td>指導者</td><td>${coachIds.map(id=>{const c=S.coaches.find(x=>x.id===id);return `${esc(c.name)}（${esc(c.license||'資格なし')}・${c.verified&&c.training?'審査済':'審査未了'}）`}).join('、')}</td></tr>
      <tr><td>会費</td><td>請求 ${yen(due)}／回収 ${yen(paid)}（回収率 ${due?Math.round(paid/due*100):100}%）／減免 ${S.members.filter(m=>m.discount>0).length}世帯</td></tr>
      <tr><td>安全管理</td><td>事故 ${inc.filter(i=>i.type==='事故').length}件／ヒヤリハット ${inc.filter(i=>i.type==='ヒヤリハット').length}件</td></tr>
    </table>
    <h2 style="margin-top:18px">活動の内訳</h2>
    <div class="tbl-wrap"><table><tr><th>日付</th><th>時間</th><th>場所</th><th>指導者</th><th class="num">参加人数</th></tr>
    ${ss.map(s=>{const d=new Date(s.date);const c=S.coaches.find(x=>x.id===s.coach);return `<tr><td>${fmt(d)}（${DOW[d.getDay()]}）</td><td>${s.start}〜（${s.min}分）</td><td>${esc(s.venue)}</td><td>${esc(c?.name)}</td><td class="num">${(S.att[s.id]||[]).length}人</td></tr>`}).join('')||'<tr><td colspan="5">記録がありません</td></tr>'}
    </table></div>
  </div>`;
};
function downloadCSV(mo){
  const ss=S.sessions.filter(s=>s.status==='done'&&s.date.startsWith(mo)).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[['日付','曜日','開始','活動時間(分)','場所','指導者','指導者資格','参加人数','登録会員数']];
  ss.forEach(s=>{const d=new Date(s.date);const c=S.coaches.find(x=>x.id===s.coach);rows.push([s.date,DOW[d.getDay()],s.start,s.min,s.venue,c?.name||'',c?.license||'',(S.att[s.id]||[]).length,S.members.length]);});
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`実績報告_${mo}.csv`; a.click(); toast('CSVを出力しました');
}

/* ---------- 起動 ---------- */
load();
// 日付がずれた古いデモデータは作り直す
if(!S.months || !S.fees[S.months.thisM] || S.months.thisM !== `${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,'0')}`){ S=seed(); save(); }
go('dash');
loadWeather();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});}
</script>
</body>
