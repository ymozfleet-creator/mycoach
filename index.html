<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MyCOACH | スポーツ指導者マッチング</title>
<meta name="description" content="スポーツを教えたい人と学びたい人をつなぐマッチングサービス MyCOACH">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2239; --ink2:#4A607A; --court:#0E7CD6; --court-deep:#0A5FA8; --court-soft:#D6ECFF;
  --sky:#EAF5FF; --bg:#F4FAFF; --white:#FFFFFF; --turf:#12B27C; --turf-soft:#DDF6EE;
  --flag:#FF6B4A; --flag-soft:#FFE9E3; --gold:#FFB020; --line:#D9E8F6; --danger:#E24A4A;
  --radius:16px; --shadow:0 6px 24px rgba(14,124,214,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--court);text-decoration:none}
.rounded{font-family:'M PLUS Rounded 1c',sans-serif}
.num{font-family:'Oswald',sans-serif;letter-spacing:.02em}

/* ---------- 共通レイアウト ---------- */
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:60px;max-width:1060px;margin:0 auto;padding:0 18px}
.logo{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:22px;color:var(--court);display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .ball{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--court),#3FB2FF);display:grid;place-items:center;color:#fff;font-size:15px}
.top-actions{display:flex;gap:10px;align-items:center}
.demo-chip{background:var(--gold);color:#5b3c00;font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
main{min-height:calc(100vh - 60px);padding-bottom:90px}

/* タブナビ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}
.tabbar-in{display:flex;width:100%;max-width:640px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 calc(9px + env(safe-area-inset-bottom));color:var(--ink2);font-size:10.5px;font-weight:600;position:relative}
.tab .ic{font-size:20px;line-height:1}
.tab.active{color:var(--court)}
.tab .badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:99px;background:var(--flag);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:99px;padding:11px 22px;font-size:14.5px;transition:transform .12s ease, box-shadow .12s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--court),#2CA1F2);color:#fff;box-shadow:0 4px 14px rgba(14,124,214,.35)}
.btn-turf{background:var(--turf);color:#fff;box-shadow:0 4px 14px rgba(18,178,124,.3)}
.btn-flag{background:var(--flag);color:#fff}
.btn-ghost{background:#fff;color:var(--court);border:1.5px solid var(--court)}
.btn-soft{background:var(--sky);color:var(--court)}
.btn-danger-soft{background:#FDEBEB;color:var(--danger)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* カード・フォーム */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--court)}
.field textarea{min-height:96px;resize:vertical}
.hint{font-size:12px;color:var(--ink2)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 10px}
.pill-blue{background:var(--court-soft);color:var(--court-deep)}
.pill-turf{background:var(--turf-soft);color:#0B7A56}
.pill-gold{background:#FFF3DC;color:#8a5b00}
.pill-flag{background:var(--flag-soft);color:#C2400E}
.pill-gray{background:#EEF2F7;color:var(--ink2)}
.pill-red{background:#FDEBEB;color:var(--danger)}

/* ---------- ランディング ---------- */
.lanes{background:repeating-linear-gradient(-55deg,transparent 0 26px,rgba(255,255,255,.10) 26px 30px)}
.hero{background:linear-gradient(135deg,#0A5FA8 0%,#0E7CD6 55%,#2CA1F2 100%);color:#fff;position:relative;overflow:hidden}
.hero-in{max-width:1060px;margin:0 auto;padding:66px 18px 74px;position:relative;z-index:1}
.hero h1{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:clamp(28px,5.4vw,46px);line-height:1.35;letter-spacing:.01em}
.hero p.lead{margin-top:14px;font-size:clamp(14px,2.4vw,17px);opacity:.94;max-width:560px}
.hero-cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-primary{background:#fff;color:var(--court);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero .btn-ghost{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.hero-stats{margin-top:34px;display:flex;gap:26px;flex-wrap:wrap}
.hstat .n{font-family:'Oswald',sans-serif;font-size:32px;font-weight:600;line-height:1}
.hstat .l{font-size:12px;opacity:.85;margin-top:4px}
.sec{padding:56px 0}
.sec h2{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:clamp(21px,3.4vw,28px);text-align:center}
.sec .sub{text-align:center;color:var(--ink2);margin-top:8px;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 20px;text-align:center;box-shadow:var(--shadow)}
.step .ic{font-size:34px}
.step h3{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;margin-top:10px;font-size:16.5px}
.step p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.step .no{font-family:'Oswald',sans-serif;color:var(--court);font-size:13px;font-weight:600;letter-spacing:.14em}
.sportchips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:26px;max-width:760px;margin-left:auto;margin-right:auto}
.sportchip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--ink)}
.cta-band{background:linear-gradient(135deg,var(--turf),#2BD09A);color:#fff;border-radius:20px;padding:34px 26px;text-align:center;margin:10px 0 40px}
.cta-band h3{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:21px}
.cta-band p{font-size:14px;opacity:.94;margin-top:6px}
.cta-band .btn{margin-top:16px;background:#fff;color:#0B7A56}
footer{border-top:1px solid var(--line);padding:26px 0 110px;text-align:center;color:var(--ink2);font-size:12.5px}
@media(max-width:720px){.steps{grid-template-columns:1fr}}

/* ---------- 認証 ---------- */
.auth-wrap{max-width:440px;margin:34px auto;padding:0 18px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow)}
.auth-tabs{display:flex;background:var(--sky);border-radius:12px;padding:4px;margin-bottom:22px}
.auth-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink2)}
.auth-tab.active{background:#fff;color:var(--court);box-shadow:0 2px 8px rgba(14,124,214,.15)}
.role-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-opt{border:2px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center;cursor:pointer;transition:.15s}
.role-opt .ic{font-size:26px}
.role-opt .t{font-weight:800;font-size:14px;margin-top:5px;font-family:'M PLUS Rounded 1c',sans-serif}
.role-opt .d{font-size:11px;color:var(--ink2)}
.role-opt.sel{border-color:var(--court);background:var(--sky)}
.demo-box{margin-top:18px;background:#FFF8EA;border:1px dashed var(--gold);border-radius:12px;padding:14px}
.demo-box .t{font-size:12.5px;font-weight:700;color:#8a5b00;margin-bottom:8px}
.demo-box .btn{margin:3px 4px 3px 0}

/* ---------- 検索 ---------- */
.page-head{padding:24px 0 6px}
.page-head h1{font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:22px}
.page-head p{color:var(--ink2);font-size:13.5px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 20px}
.filters select,.filters input{border:1.5px solid var(--line);border-radius:99px;padding:9px 16px;background:#fff;outline:none;font-size:13.5px}
.filters input{flex:1;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:15px}
.ucard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .15s}
.ucard:hover{transform:translateY(-2px)}
.ucard .hd{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--court-soft),#fff);border:2px solid var(--court-soft);display:grid;place-items:center;font-size:25px;flex-shrink:0}
.avatar.lg{width:74px;height:74px;font-size:36px}
.ucard .nm{font-weight:800;font-size:15.5px;font-family:'M PLUS Rounded 1c',sans-serif}
.ucard .meta{font-size:12px;color:var(--ink2)}
.ucard .intro{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.ucard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.fee{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;color:var(--court)}
.fee small{font-family:'Noto Sans JP';font-size:11px;color:var(--ink2);font-weight:500}
.likedby{position:absolute;top:-9px;right:12px}
.empty{padding:56px 20px;text-align:center;color:var(--ink2)}
.empty .ic{font-size:42px;margin-bottom:8px}

/* ---------- モーダル ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,34,57,.5);z-index:100;display:grid;place-items:center;padding:18px;animation:fade .18s ease}
.modal{background:#fff;border-radius:20px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 24px;position:relative;animation:pop .2s ease}
.modal .close{position:absolute;top:12px;right:14px;font-size:22px;color:var(--ink2);padding:6px}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:scale(.94);opacity:0}}

/* MATCH演出 */
.match-fx{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#0A5FA8,#2CA1F2);display:grid;place-items:center;animation:fade .25s ease}
.match-fx .in{text-align:center;color:#fff}
.match-fx .avs{display:flex;justify-content:center;align-items:center;gap:-10px}
.match-fx .avatar{width:92px;height:92px;font-size:44px;border:4px solid #fff;background:#fff}
.match-fx .av-l{animation:slideL .5s cubic-bezier(.2,.9,.3,1.2)}
.match-fx .av-r{animation:slideR .5s cubic-bezier(.2,.9,.3,1.2);margin-left:-14px}
.match-fx h2{font-family:'Oswald',sans-serif;font-size:56px;font-weight:600;letter-spacing:.1em;margin-top:18px;animation:pop .4s .3s both}
.match-fx p{opacity:.9;margin-top:6px;animation:fade .4s .45s both}
.match-fx .btn{margin-top:22px;background:#fff;color:var(--court)}
@keyframes slideL{from{transform:translateX(-120px);opacity:0}}
@keyframes slideR{from{transform:translateX(120px);opacity:0}}

/* ---------- リスト（マッチ/メッセージ/契約） ---------- */
.list{display:flex;flex-direction:column;gap:11px}
.lrow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:.12s}
.lrow:hover{border-color:var(--court)}
.lrow .bd{flex:1;min-width:0}
.lrow .nm{font-weight:700;font-size:14.5px}
.lrow .sub{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rt{text-align:right;flex-shrink:0}
.lrow .tm{font-size:11px;color:var(--ink2)}
.subtabs{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.subtab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:700;color:var(--ink2)}
.subtab.active{background:var(--court);border-color:var(--court);color:#fff}

/* ---------- チャット ---------- */
.chat{max-width:640px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 60px)}
.chat-hd{display:flex;align-items:center;gap:11px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.chat-hd .back{font-size:20px;color:var(--court);padding:4px 8px}
.chat-hd .nm{font-weight:800;font-size:15px}
.chat-hd .sub{font-size:11.5px;color:var(--ink2)}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.msg{max-width:76%;padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--court);color:#fff;border-bottom-right-radius:5px}
.msg.you{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .tm{display:block;font-size:10px;opacity:.65;margin-top:2px;text-align:right}
.chat-ct-banner{margin:0 16px;padding:10px 14px;border-radius:12px;background:var(--turf-soft);color:#0B7A56;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-in{display:flex;gap:9px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 15px;resize:none;height:44px;max-height:110px;outline:none}
.chat-in .send{width:44px;height:44px;border-radius:50%;background:var(--court);color:#fff;font-size:17px;flex-shrink:0}
.sysmsg{align-self:center;background:#E7F0FA;color:var(--ink2);font-size:11.5px;border-radius:99px;padding:4px 14px}

/* ---------- 契約 ---------- */
.ct-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.ct-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ct-card h3{font-size:15.5px;font-weight:800;font-family:'M PLUS Rounded 1c',sans-serif}
.ct-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:12px 0;font-size:13px}
.ct-meta .k{color:var(--ink2);font-size:11.5px}
.ct-meta .v{font-weight:700}
.ct-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* ---------- 管理画面 ---------- */
.adm-head{background:var(--ink);color:#fff;padding:20px 0}
.adm-head h1{font-family:'M PLUS Rounded 1c',sans-serif;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.adm-tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.adm-tab{background:rgba(255,255,255,.12);color:#cfe3f5;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:700}
.adm-tab.active{background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;margin:22px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .n{font-family:'Oswald',sans-serif;font-size:30px;font-weight:600;color:var(--court);line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2);font-weight:600;margin-top:3px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{background:var(--sky);color:var(--ink2);font-size:11.5px;text-align:left;padding:10px 13px;white-space:nowrap}
td{padding:11px 13px;border-top:1px solid var(--line);vertical-align:middle}
.tbl-actions{display:flex;gap:6px;flex-wrap:nowrap}
.adm-toolbar{display:flex;gap:9px;align-items:center;margin:18px 0 12px;flex-wrap:wrap}
.adm-toolbar input,.adm-toolbar select{border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;background:#fff}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;padding:10px 22px;font-size:13.5px;font-weight:600;z-index:300;animation:fade .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notice{background:#FFF8EA;border:1px solid #F3D9A0;border-radius:12px;padding:12px 15px;font-size:12.5px;color:#6b4a00;margin:14px 0}

/* ピクトグラム */
svg.pict{vertical-align:-0.18em}
.avatar{color:var(--court-deep)}
.avatar svg{width:56%;height:56%}
.tab .ic svg{width:20px;height:20px;display:block}
.step .ic svg{width:36px;height:36px;color:var(--court)}
.empty .ic svg{width:44px;height:44px;color:#9DB8D2}
.role-opt .ic svg{width:26px;height:26px;color:var(--court)}
.btn svg{flex-shrink:0}
.chat-in .send{display:grid;place-items:center}
.match-fx .avatar{color:var(--court)}
.sportchip svg{width:16px;height:16px;color:var(--court);vertical-align:-0.22em}
.demo-box svg{vertical-align:-0.18em}
/* 通知・写真・評価・決済 */
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.bell{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--court);background:var(--sky)}
.bell .badge{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:99px;background:var(--flag);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.notif{display:flex;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;align-items:flex-start}
.notif.unread{background:var(--sky);border-radius:10px}
.notif .tx{flex:1}
.notif .tm{font-size:11px;color:var(--ink2);white-space:nowrap}
.st{color:#D3DFEC;display:inline-flex}.st.on{color:var(--gold)}
.st svg{fill:currentColor;stroke:currentColor}
.rate{font-size:12px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:3px}
.starpick{display:flex;gap:6px;justify-content:center;margin:10px 0 16px}
.starpick button{color:#D3DFEC;padding:2px}
.starpick button.on{color:var(--gold)}
.starpick svg{width:32px;height:32px;fill:currentColor;stroke:currentColor}
.idthumb{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.pay-brk{background:var(--sky);border-radius:12px;padding:13px 15px;font-size:13px;margin:12px 0}
.pay-brk .row{display:flex;justify-content:space-between;padding:2px 0}
.pay-brk .row.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800}
.vbadge{display:inline-flex;align-items:center;gap:3px;vertical-align:2px}

/* --- 受講形態・認証申請 --- */
.seg{display:flex;gap:8px}
.seg-btn{flex:1;padding:11px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.seg-btn.sel{border-color:var(--court);background:var(--sky);color:var(--court-deep)}
.verify-box{border:1.5px dashed var(--court);background:var(--sky);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.verify-box .vb-t{font-weight:800;font-size:13.5px;color:var(--court-deep);display:flex;align-items:center;gap:6px;margin-bottom:6px}
/* --- Landing v2 --- */

function resizeImage(file, max=480){ return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
      const sc=Math.min(1, max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc)||1; cv.height=Math.round(img.height*sc)||1;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg',0.82)); };
    img.onerror=rej; img.src=r.result; };
  r.onerror=rej; r.readAsDataURL(file); }); }

const LocalDB = {
  mode:'demo',
  _load(){ try{ const d=JSON.parse(localStorage.getItem(LS_DB)); if(d&&d.users){ ['notifications','payments','reviews','payouts'].forEach(k=>{ if(!d[k]) d[k]=[]; }); return d; } }catch(e){} const s=seedDB(); localStorage.setItem(LS_DB, JSON.stringify(s)); return s; },
  _save(db){ localStorage.setItem(LS_DB, JSON.stringify(db)); },
  async init(){},
  async signUp(email,pw,profile){
    const db=this._load();
    if(Object.values(db.users).some(u=>u.email===email)) throw new Error('このメールアドレスは既に登録されています');
    const id=uid('u'); const user={id, email, pw, suspended:false, isAdmin:false, createdAt:Date.now(), ...profile};
    db.users[id]=user; this._save(db); localStorage.setItem(LS_SES,id); return user;
  },
  async signIn(email,pw){
    const db=this._load();
    const u=Object.values(db.users).find(u=>u.email===email&&u.pw===pw);
    if(!u) throw new Error('メールアドレスまたはパスワードが正しくありません');
    if(u.suspended) throw new Error('このアカウントは停止されています。運営までお問い合わせください');
    localStorage.setItem(LS_SES,u.id); return u;
  },
  async signOutUser(){ localStorage.removeItem(LS_SES); },
  async currentUser(){ const id=localStorage.getItem(LS_SES); if(!id) return null; const db=this._load(); const u=db.users[id]; return (u&&!u.suspended)?u:null; },
  async getUser(id){ return this._load().users[id]||null; },
  async updateUser(id,patch){ const db=this._load(); Object.assign(db.users[id],patch); this._save(db); return db.users[id]; },
  async listUsers(role){ return Object.values(this._load().users).filter(u=>u.role===role&&!u.suspended); },
  async allUsers(){ return Object.values(this._load().users); },
  async like(from,to){
    const db=this._load();
    if(!db.likes.some(l=>l.from===from&&l.to===to)) db.likes.push({from,to,ts:Date.now()});
    const mutual=db.likes.some(l=>l.from===to&&l.to===from);
    let matchId=null;
    if(mutual){
      const ex=db.matches.find(m=>m.users.includes(from)&&m.users.includes(to));
      if(ex) matchId=ex.id;
      else{ matchId=uid('m'); db.matches.push({id:matchId,users:[from,to],ts:Date.now()}); db.messages[matchId]=[]; }
    }
    this._save(db); return {matched:mutual, matchId};
  },
  async getLikes(me){
    const db=this._load();
    return { sent:db.likes.filter(l=>l.from===me), received:db.likes.filter(l=>l.to===me) };
  },
  async listMatches(me){
    const db=this._load();
    return db.matches.filter(m=>m.users.includes(me)).map(m=>{
      const other=db.users[m.users.find(u=>u!==me)];
      const msgs=db.messages[m.id]||[];
      return {...m, other, lastMsg:msgs[msgs.length-1]||null};
    }).sort((a,b)=>((b.lastMsg?.ts||b.ts)-(a.lastMsg?.ts||a.ts)));
  },
  async getMatch(id){ const db=this._load(); const m=db.matches.find(x=>x.id===id); return m||null; },
  async sendMessage(matchId,from,text){
    const db=this._load();
    (db.messages[matchId]=db.messages[matchId]||[]).push({id:uid('ms'),from,text,ts:Date.now()});
    this._save(db);
  },
  listenMessages(matchId,cb){
    const read=()=>cb((this._load().messages[matchId]||[]).slice());
    read();
    const iv=setInterval(read,1500);
    const onS=e=>{ if(e.key===LS_DB) read(); };
    window.addEventListener('storage',onS);
    return ()=>{ clearInterval(iv); window.removeEventListener('storage',onS); };
  },
  async createContract(c){ const db=this._load(); const ct={id:uid('ct'),ts:Date.now(),decidedTs:null,status:'proposed',log:[],...c}; db.contracts.push(ct); this._save(db); return ct; },
  async updateContract(id,patch){ const db=this._load(); const ct=db.contracts.find(c=>c.id===id); Object.assign(ct,patch); this._save(db); return ct; },
  async listContracts(me){ return this._load().contracts.filter(c=>c.coach===me||c.player===me).sort((a,b)=>b.ts-a.ts); },
  async allContracts(){ return this._load().contracts.slice().sort((a,b)=>b.ts-a.ts); },
  async contractForMatch(matchId){ const cs=this._load().contracts.filter(c=>c.matchId===matchId); return cs.sort((a,b)=>b.ts-a.ts)[0]||null; },
  async report(from,target,reason,detail){ const db=this._load(); db.reports.push({id:uid('r'),from,target,reason,detail,ts:Date.now(),status:'open'}); this._save(db); },
  async listReports(){ return this._load().reports.slice().sort((a,b)=>b.ts-a.ts); },
  async updateReport(id,patch){ const db=this._load(); const r=db.reports.find(x=>x.id===id); Object.assign(r,patch); this._save(db); },
  async stats(){
    const db=this._load(); const us=Object.values(db.users);
    return {
      coaches:us.filter(u=>u.role==='coach').length,
      players:us.filter(u=>u.role==='player').length,
      matches:db.matches.length,
      likes:db.likes.length,
      active:db.contracts.filter(c=>c.status==='active').length,
      proposed:db.contracts.filter(c=>c.status==='proposed').length,
      gmv:db.contracts.filter(c=>c.status==='active'||c.status==='completed').reduce((s,c)=>s+Number(c.fee||0),0),
      payments:db.payments.length,
      feeRevenue:db.payments.reduce((s,p)=>s+Number(p.fee||0),0),
      pendingCoaches:us.filter(u=>u.role==='coach'&&u.verified==='pending'&&!u.deleted).length,
      openReports:db.reports.filter(r=>r.status==='open').length,
    };
  },
  async notify(to,type,text,link,dedupe){ const db=this._load();
    if(dedupe && db.notifications.some(n=>n.to===to&&!n.read&&n.link===link&&n.type===type)) return;
    db.notifications.push({id:uid('n'),to,type,text,link,ts:Date.now(),read:false}); this._save(db); },
  async listNotifications(me){ return this._load().notifications.filter(n=>n.to===me).sort((a,b)=>b.ts-a.ts).slice(0,50); },
  async unreadNotifCount(me){ return this._load().notifications.filter(n=>n.to===me&&!n.read).length; },
  async markNotifsRead(me){ const db=this._load(); db.notifications.forEach(n=>{ if(n.to===me) n.read=true; }); this._save(db); },
  async addPayment(p){ const db=this._load(); const pay={id:uid('pay'),ts:Date.now(),...p}; db.payments.push(pay); this._save(db); return pay; },
  async paymentsForContract(ctId){ return this._load().payments.filter(p=>p.contractId===ctId).sort((a,b)=>b.ts-a.ts); },
  async allPayments(){ return this._load().payments.slice().sort((a,b)=>b.ts-a.ts); },
  async addReview(r){ const db=this._load(); const rv={id:uid('rv'),ts:Date.now(),...r}; db.reviews.push(rv);
    const list=db.reviews.filter(x=>x.to===r.to); const avg=list.reduce((s,x)=>s+x.rating,0)/list.length;
    db.users[r.to].ratingAvg=Math.round(avg*10)/10; db.users[r.to].ratingCount=list.length; this._save(db); return rv; },
  async listReviews(target){ return this._load().reviews.filter(r=>r.to===target).sort((a,b)=>b.ts-a.ts); },
  async hasReview(contractId,from){ return this._load().reviews.some(r=>r.contractId===contractId&&r.from===from); },
  async unsettledByCoach(){ const db=this._load(); const map={};
    db.payments.filter(p=>!p.payoutId).forEach(p=>{ const m=map[p.coach]=map[p.coach]||{coach:p.coach,net:0,count:0}; m.net+=Number(p.net||0); m.count++; });
    return Object.values(map).sort((a,b)=>b.net-a.net); },
  async settleCoach(coach){ const db=this._load();
    const targets=db.payments.filter(p=>p.coach===coach&&!p.payoutId);
    if(!targets.length) return null;
    const id=uid('po'); const total=targets.reduce((s,p)=>s+Number(p.net||0),0);
    db.payouts=db.payouts||[];
    db.payouts.push({id,coach,amount:total,count:targets.length,paymentIds:targets.map(p=>p.id),ts:Date.now()});
    targets.forEach(p=>p.payoutId=id);
    this._save(db); return {id,amount:total,count:targets.length}; },
  async allPayouts(){ const db=this._load(); return (db.payouts||[]).slice().sort((a,b)=>b.ts-a.ts); },
  async myUnsettled(coach){ return this._load().payments.filter(p=>p.coach===coach&&!p.payoutId).reduce((s,p)=>s+Number(p.net||0),0); },
  async resetPassword(email,newPw){ const db=this._load(); const u=Object.values(db.users).find(x=>x.email===email&&!x.deleted); if(!u) throw new Error('このメールアドレスの登録が見つかりません'); u.pw=newPw; this._save(db); },
  async deleteAccount(id){ const db=this._load(); const u=db.users[id]; u.deleted=true; u.suspended=true; this._save(db); localStorage.removeItem(LS_SES); },
  resetDemo(){ localStorage.removeItem(LS_DB); localStorage.removeItem(LS_SES); location.hash=''; location.reload(); }
};

/* =========================================================================
   Firebase DB（FIREBASE_CONFIG 設定時に有効化）
   ========================================================================= */
const FireDB = {
  mode:'firebase', _auth:null, _fs:null,
  async init(){
    const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    await load('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    this._auth=firebase.auth(); this._fs=firebase.firestore();
    await new Promise(res=>{ const un=this._auth.onAuthStateChanged(()=>{un();res();}); });
  },
  async signUp(email,pw,profile){
    const cred=await this._auth.createUserWithEmailAndPassword(email,pw);
    const user={id:cred.user.uid,email,suspended:false,isAdmin:false,createdAt:Date.now(),...profile};
    await this._fs.collection('users').doc(user.id).set(user); return user;
  },
  async signIn(email,pw){
    const cred=await this._auth.signInWithEmailAndPassword(email,pw);
    const d=await this._fs.collection('users').doc(cred.user.uid).get();
    const u=d.exists?d.data():null;
    if(!u) throw new Error('ユーザー情報が見つかりません');
    if(u.deleted){ await this._auth.signOut(); throw new Error('退会済みのアカウントです'); }
    if(u.suspended){ await this._auth.signOut(); throw new Error('このアカウントは停止されています'); }
    this._uc[u.id]={u,t:Date.now()};
    return u;
  },
  async signOutUser(){ await this._auth.signOut(); },
  async currentUser(){ const cu=this._auth.currentUser; if(!cu) return null; const u=await this.getUser(cu.uid); return (u&&!u.suspended)?u:null; },
  _uc:{}, /* 30秒ユーザーキャッシュ（読取コスト削減） */
  async getUser(id){
    const c=this._uc[id]; if(c && Date.now()-c.t<30000) return c.u;
    const d=await this._fs.collection('users').doc(id).get(); const u=d.exists?d.data():null;
    this._uc[id]={u,t:Date.now()}; return u; },
  async updateUser(id,patch){ await this._fs.collection('users').doc(id).update(patch); delete this._uc[id]; return this.getUser(id); },
  async listUsers(role){ const q=await this._fs.collection('users').where('role','==',role).get(); return q.docs.map(d=>d.data()).filter(u=>!u.suspended&&!u.deleted); },
  async allUsers(){ const q=await this._fs.collection('users').get(); return q.docs.map(d=>d.data()); },
  async like(from,to){
    await this._fs.collection('likes').doc(`${from}_${to}`).set({from,to,ts:Date.now()});
    const rev=await this._fs.collection('likes').doc(`${to}_${from}`).get();
    let matchId=null;
    if(rev.exists){
      matchId=[from,to].sort().join('__');
      const m=this._fs.collection('matches').doc(matchId);
      if(!(await m.get()).exists) await m.set({id:matchId,users:[from,to],ts:Date.now()});
    }
    return {matched:rev.exists, matchId};
  },
  async getLikes(me){
    const s=await this._fs.collection('likes').where('from','==',me).get();
    const r=await this._fs.collection('likes').where('to','==',me).get();
    return {sent:s.docs.map(d=>d.data()), received:r.docs.map(d=>d.data())};
  },
  async listMatches(me){
    const q=await this._fs.collection('matches').where('users','array-contains',me).get();
    const out=[];
    for(const d of q.docs){
      const m=d.data();
      const other=await this.getUser(m.users.find(u=>u!==me));
      const lm=await this._fs.collection('matches').doc(m.id).collection('messages').orderBy('ts','desc').limit(1).get();
      out.push({...m, other, lastMsg:lm.docs[0]?lm.docs[0].data():null});
    }
    return out.sort((a,b)=>((b.lastMsg?.ts||b.ts)-(a.lastMsg?.ts||a.ts)));
  },
  async getMatch(id){ const d=await this._fs.collection('matches').doc(id).get(); return d.exists?d.data():null; },
  async sendMessage(matchId,from,text){
    await this._fs.collection('matches').doc(matchId).collection('messages').add({from,text,ts:Date.now()});
  },
  listenMessages(matchId,cb){
    return this._fs.collection('matches').doc(matchId).collection('messages').orderBy('ts')
      .onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), err=>console.error('メッセージ購読エラー:', err));
  },
  async createContract(c){ const id=uid('ct'); const ct={id,ts:Date.now(),decidedTs:null,status:'proposed',log:[],...c}; await this._fs.collection('contracts').doc(id).set(ct); return ct; },
  async updateContract(id,patch){ await this._fs.collection('contracts').doc(id).update(patch); const d=await this._fs.collection('contracts').doc(id).get(); return d.data(); },
  async listContracts(me){
    const a=await this._fs.collection('contracts').where('coach','==',me).get();
    const b=await this._fs.collection('contracts').where('player','==',me).get();
    return [...a.docs,...b.docs].map(d=>d.data()).sort((x,y)=>y.ts-x.ts);
  },
  async allContracts(){ const q=await this._fs.collection('contracts').get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); },
  async contractForMatch(matchId){ const q=await this._fs.collection('contracts').where('matchId','==',matchId).get(); const cs=q.docs.map(d=>d.data()); return cs.sort((a,b)=>b.ts-a.ts)[0]||null; },
  async report(from,target,reason,detail){ const id=uid('r'); await this._fs.collection('reports').doc(id).set({id,from,target,reason,detail,ts:Date.now(),status:'open'}); },
  async listReports(){ const q=await this._fs.collection('reports').get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); },
  async updateReport(id,patch){ await this._fs.collection('reports').doc(id).update(patch); },
  async notify(to,type,text,link,dedupe){
    if(dedupe){ const q=await this._fs.collection('notifications').where('to','==',to).where('read','==',false).get();
      if(q.docs.some(d=>{const n=d.data();return n.link===link&&n.type===type;})) return; }
    const id=uid('n'); await this._fs.collection('notifications').doc(id).set({id,to,type,text,link,ts:Date.now(),read:false}); },
  async listNotifications(me){ const q=await this._fs.collection('notifications').where('to','==',me).get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts).slice(0,50); },
  async unreadNotifCount(me){ const q=await this._fs.collection('notifications').where('to','==',me).where('read','==',false).get(); return q.size; },
  async markNotifsRead(me){ const q=await this._fs.collection('notifications').where('to','==',me).where('read','==',false).get(); await Promise.all(q.docs.map(d=>d.ref.update({read:true}))); },
  async addPayment(p){ const id=uid('pay'); const pay={id,ts:Date.now(),...p}; await this._fs.collection('payments').doc(id).set(pay); return pay; },
  async paymentsForContract(ctId){ const q=await this._fs.collection('payments').where('contractId','==',ctId).get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); },
  async allPayments(){ const q=await this._fs.collection('payments').get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); },
  async addReview(r){ const id=uid('rv'); const rv={id,ts:Date.now(),...r}; await this._fs.collection('reviews').doc(id).set(rv);
    const q=await this._fs.collection('reviews').where('to','==',r.to).get(); const list=q.docs.map(d=>d.data());
    const avg=list.reduce((s,x)=>s+x.rating,0)/list.length;
    await this._fs.collection('users').doc(r.to).update({ratingAvg:Math.round(avg*10)/10, ratingCount:list.length}); return rv; },
  async listReviews(target){ const q=await this._fs.collection('reviews').where('to','==',target).get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); },
  async hasReview(contractId,from){ const q=await this._fs.collection('reviews').where('contractId','==',contractId).get(); return q.docs.map(d=>d.data()).some(r=>r.from===from); },
  async unsettledByCoach(){ const q=await this._fs.collection('payments').get(); const map={};
    q.docs.map(d=>d.data()).filter(p=>!p.payoutId).forEach(p=>{ const m=map[p.coach]=map[p.coach]||{coach:p.coach,net:0,count:0}; m.net+=Number(p.net||0); m.count++; });
    return Object.values(map).sort((a,b)=>b.net-a.net); },
  async settleCoach(coach){ const q=await this._fs.collection('payments').where('coach','==',coach).get();
    const targets=q.docs.map(d=>d.data()).filter(p=>!p.payoutId);
    if(!targets.length) return null;
    const id=uid('po'); const total=targets.reduce((s,p)=>s+Number(p.net||0),0);
    await this._fs.collection('payouts').doc(id).set({id,coach,amount:total,count:targets.length,paymentIds:targets.map(p=>p.id),ts:Date.now()});
    await Promise.all(targets.map(p=>this._fs.collection('payments').doc(p.id).update({payoutId:id})));
    return {id,amount:total,count:targets.length}; },
  async allPayouts(){ const q=await this._fs.collection('payouts').get(); return q.docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts); },
  async myUnsettled(coach){ const q=await this._fs.collection('payments').where('coach','==',coach).get();
    return q.docs.map(d=>d.data()).filter(p=>!p.payoutId).reduce((s,p)=>s+Number(p.net||0),0); },
  async resetPassword(email){ await this._auth.sendPasswordResetEmail(email); },
  async deleteAccount(id){ await this._fs.collection('users').doc(id).update({deleted:true,suspended:true}); delete this._uc[id]; await this._auth.signOut(); },
  async stats(){
    const [us,ms,ls,cs,rs,ps]=await Promise.all([this.allUsers(),this._fs.collection('matches').get(),this._fs.collection('likes').get(),this.allContracts(),this.listReports(),this.allPayments()]);
    return {
      coaches:us.filter(u=>u.role==='coach').length, players:us.filter(u=>u.role==='player').length,
      matches:ms.size, likes:ls.size,
      active:cs.filter(c=>c.status==='active').length, proposed:cs.filter(c=>c.status==='proposed').length,
      gmv:cs.filter(c=>c.status==='active'||c.status==='completed').reduce((s,c)=>s+Number(c.fee||0),0),
      payments:ps.length,
      feeRevenue:ps.reduce((s,p)=>s+Number(p.fee||0),0),
      pendingCoaches:us.filter(u=>u.role==='coach'&&u.verified==='pending'&&!u.deleted).length,
      openReports:rs.filter(r=>r.status==='open').length,
    };
  },
};

  async updateBadges(){
    try{
      const [likes, matches] = await Promise.all([DB.getLikes(this.me.id), DB.listMatches(this.me.id)]);
      const matchedIds = new Set(); matches.forEach(m=>m.users.forEach(u=>matchedIds.add(u)));
      const newLikes = likes.received.filter(l=>!matchedIds.has(l.from)).length;
      const read=this.readMap();
      const unread = matches.filter(m=>m.lastMsg && m.lastMsg.from!==this.me.id && m.lastMsg.ts>(read[m.id]||0)).length;
      const bl=document.getElementById('badge-like'), bm=document.getElementById('badge-msg');
      if(bl){ bl.style.display=newLikes?'grid':'none'; bl.textContent=newLikes; }
      if(bm){ bm.style.display=unread?'grid':'none'; bm.textContent=unread; }
      const nb=await DB.unreadNotifCount(this.me.id);
      const bb=document.getElementById('badge-bell');
      if(bb){ bb.style.display=nb?'grid':'none'; bb.textContent=nb; }
    }catch(e){}
  },

            <div class="t">${ic('ticket',14)} デモアカウント（パスワード: demo1234 / 管理者: admin1234）</div>
            <button class="btn btn-sm btn-soft" onclick="App.demoLogin('demo-player@mycoach.jp')">受講者</button>
            <button class="btn btn-sm btn-soft" onclick="App.demoLogin('demo-coach@mycoach.jp')">コーチ</button>
            <button class="btn btn-sm btn-soft" onclick="App.demoLogin('admin@mycoach.jp')">管理者</button>
          </div>`:''}

  async submitAuth(mode){
    const v=id=>document.getElementById(id)?.value.trim();
    const email=v('f-email'), pw=v('f-pw');
    try{
      if(!email||!pw) throw new Error('メールアドレスとパスワードを入力してください');
      if(mode==='signup'){
        if(pw.length<6) throw new Error('パスワードは6文字以上で設定してください');
        const role=this._signupRole||'player';
        const name=v('f-name'); if(!name) throw new Error('お名前を入力してください');
        const profile={ role, name, sport:v('f-sport'), area:v('f-area'),
          fee: role==='coach'?Number(v('f-fee')||0):0,
          exp: role==='coach'?(v('f-exp')||''):'', intro:v('f-intro')||'' };
        if(role==='player'){
          profile.playerType=this._ptype||'individual';
          if(profile.playerType==='team'){
            profile.teamName=v('f-teamname')||''; profile.teamSize=Number(v('f-teamsize')||0);
            if(!profile.teamName) throw new Error('チーム名を入力してください');
          }
        }else{
          profile.coachTarget=v('f-ctarget')||'both';
        }
        if(role==='coach' && !profile.fee) throw new Error('レッスン料金を入力してください');
        const pf=document.getElementById('f-photo')?.files[0];
        if(pf) profile.photo=await resizeImage(pf,480).catch(()=>{ throw new Error('写真の読み込みに失敗しました。JPEGまたはPNG画像をご利用ください'); });
        if(role==='coach'){
          const idf=document.getElementById('f-iddoc')?.files[0];
          if(idf){ profile.idDoc=await resizeImage(idf,900).catch(()=>{ throw new Error('本人確認書類の読み込みに失敗しました。JPEGまたはPNG画像をご利用ください'); }); profile.verified='pending'; profile.verifiedAppliedTs=Date.now(); }
          else profile.verified='none';
        }
        this.me=await DB.signUp(email,pw,profile);
        this.toast('登録が完了しました！');
      }else{
        this.me=await DB.signIn(email,pw);
      }
      location.hash=this.me.isAdmin?'#admin':'#browse'; this.route();
    }catch(e){ this.toast(e.message||'エラーが発生しました'); }
  },

  async logout(){ await DB.signOutUser(); this.me=null; location.hash=''; this.route(); },

  /* ---------- 検索 ---------- */
  async viewBrowse(){
    const isPlayer = this.me.role!=='coach';
    const targetRole = isPlayer?'coach':'player';
    const [users, likes, matches] = await Promise.all([DB.listUsers(targetRole), DB.getLikes(this.me.id), DB.listMatches(this.me.id)]);
    this._browse={users, likes, matchedIds:new Set(matches.flatMap(m=>m.users))};
    this.shell(`
      <div class="wrap">
        <div class="page-head">
          <h1>${isPlayer?'コーチをさがす':'指導を受けたい人をさがす'}</h1>
          <p>${isPlayer?'気になるコーチに「いいね」を送りましょう。お互いにいいねするとマッチ成立です。':'あなたの指導を待っている人に「いいね」を送りましょう。'}</p>
        </div>
        <div class="filters">
          <select id="fl-sport" onchange="App.renderBrowse()"><option value="">すべての競技</option>${SPORTS.map(s=>`<option>${s}</option>`).join('')}</select>
          <select id="fl-area" onchange="App.renderBrowse()"><option value="">すべてのエリア</option>${AREAS.map(a=>`<option>${a}</option>`).join('')}</select>
          <select id="fl-type" onchange="App.renderBrowse()">
            ${isPlayer
              ?`<option value="">指導形態：すべて</option><option value="fit">自分に合うコーチ（${this.me.playerType==='team'?'チーム':'個人'}対応）</option>`
              :`<option value="">受講形態：すべて</option><option value="individual">個人</option><option value="team">チーム</option>`}
          </select>
          <input id="fl-q" placeholder="キーワード検索" oninput="App.renderBrowse()">
        </div>
        <div class="grid" id="browse-grid"></div>
      </div>`, 'browse');
    this.renderBrowse();
  },

  renderBrowse(){
    const {users, likes, matchedIds}=this._browse;
    const sp=document.getElementById('fl-sport').value, ar=document.getElementById('fl-area').value, q=document.getElementById('fl-q').value.trim();
    const tp=document.getElementById('fl-type')?.value||'';
    const sentTo=new Set(likes.sent.map(l=>l.to));
    const recvFrom=new Set(likes.received.map(l=>l.from));
    const list=users.filter(u=>u.id!==this.me.id)
      .filter(u=>(!sp||u.sport===sp)&&(!ar||u.area===ar)&&(!q||(u.name+u.intro+u.sport).includes(q)))
      .filter(u=>{
        if(!tp) return true;
        if(this.me.role!=='coach'){
          const myType=this.me.playerType==='team'?'team':'individual';
          const ct=u.coachTarget||'both';
          return ct==='both'||ct===myType;
        }
        return (u.playerType||'individual')===tp;
      });
    const grid=document.getElementById('browse-grid');
    if(!list.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="ic">${ic('search',44)}</div>条件に合うユーザーが見つかりませんでした。<br>条件を変えて再検索してみてください。</div>`; return; }
    grid.innerHTML=list.map(u=>{
      const matched=matchedIds.has(u.id), sent=sentTo.has(u.id), recv=recvFrom.has(u.id);
      return `<div class="ucard">
        ${recv&&!matched?`<span class="likedby pill pill-flag">${ic('heart',12)} あなたに興味あり</span>`:''}
        <div class="hd" style="cursor:pointer" onclick="App.openProfile('${u.id}')">
          <div class="avatar">${avatarOf(u)}</div>
          <div><div class="nm">${esc(u.name)} ${u.verified==='approved'?`<span class="pill pill-turf vbadge">${ic('shield',11)}認証</span>`:''}</div>
          <div class="meta">${esc(u.sport)}・${esc(u.area)}${u.exp?`・${esc(u.exp)}`:''}${u.role==='coach'?`・${CTARGET_S[u.coachTarget||'both']}対応`:''}</div>
          ${u.ratingCount?`<span class="rate">${stars(u.ratingAvg,12)} ${u.ratingAvg}（${u.ratingCount}）</span>`:''}</div>
        </div>
        <div class="intro">${esc(u.intro)}</div>
        <div class="ft">
          ${u.role==='coach'?`<div class="fee">${yen(u.fee)}<small> /回</small></div>`
            :`<span class="pill pill-blue">${u.playerType==='team'?`チーム${u.teamSize?`・${u.teamSize}名`:''}`:'個人'}で受講希望</span>`}
          ${matched?`<span class="pill pill-turf">${ic('check',12)} マッチ済み</span>`
            : sent?`<button class="btn btn-sm btn-soft" disabled>いいね済み</button>`
            : `<button class="btn btn-sm ${recv?'btn-flag':'btn-primary'}" onclick="App.sendLike('${u.id}')">${recv?ic('heart',15)+' いいねを返す':ic('thumb',15)+' いいね'}</button>`}
        </div>
      </div>`;
    }).join('');
  },

  async openProfile(id){
    const u=await DB.getUser(id); if(!u) return;
    const isCoach=u.role==='coach';
    const rvs=await DB.listReviews(id);
    const rvHtml=(await Promise.all(rvs.slice(0,3).map(async r=>{ const f=await DB.getUser(r.from);
      return `<div style="border-top:1px solid var(--line);padding:8px 0;font-size:12.5px"><span class="rate">${stars(r.rating,11)}</span> <b>${esc(f?.name||'退会ユーザー')}</b><div style="color:var(--ink2)">${esc(r.comment||'')}</div></div>`; }))).join('');
    this.modal(`
      <div style="text-align:center">
        <div class="avatar lg" style="margin:0 auto">${avatarOf(u)}</div>
        <h3 class="rounded" style="font-size:19px;font-weight:800;margin-top:10px">${esc(u.name)} ${u.verified==='approved'?`<span class="pill pill-turf vbadge">${ic('shield',11)}認証</span>`:''}</h3>
        <div class="hint">${esc(u.sport)}・${esc(u.area)}${u.exp?`・${esc(u.exp)}`:''}</div>
        <div class="hint" style="margin-top:2px">${u.role==='coach'
          ?`指導形態：${CTARGET[u.coachTarget||'both']}`
          :`受講形態：${u.playerType==='team'?`チーム（${esc(u.teamName||u.name)}${u.teamSize?`・約${u.teamSize}名`:''}）`:'個人'}`}</div>
        ${u.ratingCount?`<div class="rate" style="justify-content:center;margin-top:4px">${stars(u.ratingAvg,13)} ${u.ratingAvg}（${u.ratingCount}件）</div>`:''}
        ${isCoach?`<div class="fee" style="font-size:24px;margin-top:8px">${yen(u.fee)}<small> /回</small></div>`:''}
      </div>

      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-block" onclick="App.closeModal();App.sendLike('${u.id}')">${ic('thumb')} いいねを送る</button>
        <button class="btn btn-danger-soft btn-sm" onclick="App.openReport('${u.id}')">通報</button>
      </div>`);
  },

  async sendLike(to){
    const r=await DB.like(this.me.id,to);
    if(r.matched){
      const other=await DB.getUser(to);
      this.showMatchFX(other, r.matchId);
      DB.notify(to,'match',`${this.me.name}さんとマッチが成立しました！メッセージで挨拶しましょう`,'#messages');
    }else{
      DB.notify(to,'like',`${this.me.name}さんからいいねが届きました`,'#matches');
      this.toast('いいねを送りました！');
      if(location.hash===''||location.hash==='#browse') this.viewBrowse(); else this.route();
    }
  },

  showMatchFX(other, matchId){
    const el=document.createElement('div');
    el.className='match-fx lanes';
    el.innerHTML=`<div class="in">
      <div class="avs">
        <div class="avatar av-l">${avatarOf(this.me)}</div>
        <div class="avatar av-r">${avatarOf(other)}</div>
      </div>
      <h2>MATCH!</h2>
      <p>${esc(other.name)} さんとマッチしました<br>メッセージで挨拶してみましょう。</p>
      <button class="btn" onclick="this.closest('.match-fx').remove();location.hash='#chat/${matchId}'">${ic('chat')} メッセージを送る</button>
      <div><button class="btn btn-sm" style="color:#fff;opacity:.8" onclick="this.closest('.match-fx').remove();App.route()">あとで</button></div>
    </div>`;

  /* ---------- マッチ / いいね ---------- */
  async viewMatches(tab){
    const [matches, likes]=await Promise.all([DB.listMatches(this.me.id), DB.getLikes(this.me.id)]);
    const matchedIds=new Set(matches.flatMap(m=>m.users));
    const recv=likes.received.filter(l=>!matchedIds.has(l.from));
    const sent=likes.sent.filter(l=>!matchedIds.has(l.to));
    let body='';
    if(tab==='match'){
      body = matches.length ? `<div class="list">${matches.map(m=>`
        <div class="lrow" onclick="location.hash='#chat/${m.id}'">
          <div class="avatar">${avatarOf(m.other)}</div>
          <div class="bd"><div class="nm">${esc(m.other?.name||'退会ユーザー')}</div>
          <div class="sub">${esc(m.other?.sport||'')}・${esc(m.other?.area||'')}</div></div>
          <div class="rt"><span class="pill pill-turf">マッチ中</span><div class="tm">${fmtD(m.ts)}</div></div>
        </div>`).join('')}</div>`
        : `<div class="empty"><div class="ic">${ic('link',44)}</div>まだマッチがありません。<br>「さがす」から気になる相手にいいねを送りましょう。</div>`;
    }else{
      const recvRows = await Promise.all(recv.map(async l=>{ const u=await DB.getUser(l.from); return u?`
        <div class="lrow">
          <div class="avatar" onclick="App.openProfile('${u.id}')">${avatarOf(u)}</div>
          <div class="bd" onclick="App.openProfile('${u.id}')"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.sport)}・${esc(u.area)}</div></div>
          <button class="btn btn-sm btn-flag" onclick="App.sendLike('${u.id}')">${ic('heart',15)} いいねを返す</button>
        </div>`:''; }));
      const sentRows = await Promise.all(sent.map(async l=>{ const u=await DB.getUser(l.to); return u?`
        <div class="lrow" onclick="App.openProfile('${u.id}')">
          <div class="avatar">${avatarOf(u)}</div>
          <div class="bd"><div class="nm">${esc(u.name)}</div><div class="sub">${esc(u.sport)}・${esc(u.area)}</div></div>
          <span class="pill pill-gray">返事待ち</span>
        </div>`:''; }));
      body = `
        <h3 style="font-size:14px;font-weight:800;margin:6px 0 10px">${ic('heart',15)} もらったいいね（${recv.length}）</h3>
        ${recv.length?`<div class="list">${recvRows.join('')}</div>`:`<p class="hint">まだいいねは届いていません。</p>`}
        <h3 style="font-size:14px;font-weight:800;margin:22px 0 10px">${ic('thumb',15)} 送ったいいね（${sent.length}）</h3>
        ${sent.length?`<div class="list">${sentRows.join('')}</div>`:`<p class="hint">送ったいいねはありません。</p>`}`;
    }
    this.shell(`
      <div class="wrap">
        <div class="page-head"><h1>マッチ</h1><p>お互いにいいねするとマッチ成立。メッセージから契約まで進めます。</p></div>
        <div class="subtabs">
          <button class="subtab ${tab==='match'?'active':''}" onclick="App.viewMatches('match')">マッチ一覧（${matches.length}）</button>
          <button class="subtab ${tab==='likes'?'active':''}" onclick="App.viewMatches('likes')">いいね</button>
        </div>
        ${body}
      </div>`, 'matches');
  },

  /* ---------- メッセージ一覧 ---------- */
  async viewMessages(){
    const matches=await DB.listMatches(this.me.id);
    const read=this.readMap();
    const body = matches.length ? `<div class="list">${matches.map(m=>{
      const unread = m.lastMsg && m.lastMsg.from!==this.me.id && m.lastMsg.ts>(read[m.id]||0);
      return `<div class="lrow" onclick="location.hash='#chat/${m.id}'">
        <div class="avatar">${avatarOf(m.other)}</div>
        <div class="bd"><div class="nm">${esc(m.other?.name||'退会ユーザー')} ${unread?'<span class="pill pill-flag">新着</span>':''}</div>
        <div class="sub">${m.lastMsg?esc(m.lastMsg.text):'マッチしました！挨拶してみましょう'}</div></div>
        <div class="rt"><div class="tm">${m.lastMsg?fmtT(m.lastMsg.ts):fmtD(m.ts)}</div></div>
      </div>`;}).join('')}</div>`
      : `<div class="empty"><div class="ic">${ic('chat',44)}</div>マッチするとここでメッセージができます。</div>`;
    this.shell(`<div class="wrap"><div class="page-head"><h1>メッセージ</h1><p>マッチした相手と日程・内容を相談しましょう。</p></div>${body}</div>`, 'messages');
  },

  /* ---------- チャット ---------- */
  async viewChat(matchId){
    const m=await DB.getMatch(matchId);
    if(!m || !m.users.includes(this.me.id)){ this.toast('このトークにはアクセスできません'); location.hash='#messages'; return; }
    const other=await DB.getUser(m.users.find(u=>u!==this.me.id));
    this._chatOther=other;
    const ct=await DB.contractForMatch(matchId);
    const iAmCoach = this.me.role==='coach';
    let banner='';
    if(ct){
      if(ct.status==='proposed'){
        banner = ct.proposer===this.me.id
          ? `<div class="chat-ct-banner">${ic('doc',14)} 契約を提案中です（相手の承諾待ち）<button class="btn btn-sm btn-soft" onclick="location.hash='#contracts'">内容を見る</button></div>`
          : `<div class="chat-ct-banner">${ic('doc',14)} 契約の提案が届いています<button class="btn btn-sm btn-turf" onclick="location.hash='#contracts'">確認して返答</button></div>`;
      }else if(ct.status==='active'){
        banner = `<div class="chat-ct-banner">${ic('check',14)} 契約中：${esc(ct.title)}<button class="btn btn-sm btn-soft" onclick="location.hash='#contracts'">詳細</button></div>`;
      }
    }
    const canPropose = !ct || ['declined','completed','cancelled'].includes(ct.status);
    document.getElementById('app').innerHTML=`
      <div class="topbar"><div class="topbar-in">
        <div class="logo" onclick="location.hash=''"><span class="ball">M</span>MyCOACH</div>
        <div class="top-actions"><span class="hint">${esc(this.me.name)} さん</span></div>
      </div></div>
      <div class="chat">
        <div class="chat-hd">
          <button class="back" onclick="location.hash='#messages'">←</button>
          <div class="avatar" style="width:40px;height:40px;font-size:20px">${avatarOf(other)}</div>
          <div style="flex:1"><div class="nm">${esc(other?.name||'退会ユーザー')}</div><div class="sub">${esc(other?.sport||'')}・${esc(other?.area||'')}</div></div>
          ${canPropose?`<button class="btn btn-sm btn-turf" onclick="App.openContractForm('${matchId}','${other?.id}')">${iAmCoach?ic('doc',14)+' 契約を提案':ic('doc',14)+' 契約を依頼'}</button>`:''}
          <button class="btn btn-sm btn-danger-soft" onclick="App.openReport('${other?.id}')">通報</button>
        </div>
        ${banner}
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-in">
          <textarea id="chat-text" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();App.sendChat('${matchId}')}"></textarea>
          <button class="send" onclick="App.sendChat('${matchId}')">${ic('send')}</button>
        </div>
      </div>`;
    this.setRead(matchId);
    this.unsubChat = DB.listenMessages(matchId, msgs=>{
      const body=document.getElementById('chat-body'); if(!body) return;
      const html = [`<div class="sysmsg">${fmtD(m.ts)} にマッチしました</div>`]
        .concat(msgs.map(ms=>`<div class="msg ${ms.from===this.me.id?'me':'you'}">${esc(ms.text)}<span class="tm">${fmtT(ms.ts)}</span></div>`));
      if(body.dataset.n!==String(msgs.length)){
        body.innerHTML=html.join(''); body.dataset.n=String(msgs.length);
        body.scrollTop=body.scrollHeight;
        this.setRead(matchId);
      }
    });
  },

  async sendChat(matchId){
    const ta=document.getElementById('chat-text');
    const text=ta.value.trim(); if(!text) return;
    ta.value='';
    await DB.sendMessage(matchId, this.me.id, text);
    if(this._chatOther) DB.notify(this._chatOther.id,'msg',`${this.me.name}さんから新着メッセージがあります`,`#chat/${matchId}`,true);
  },

  /* ---------- 契約 ---------- */
  async openContractForm(matchId, otherId){
    const other=await DB.getUser(otherId);
    const iAmCoach=this.me.role==='coach';
    const coach=iAmCoach?this.me:other, player=iAmCoach?other:this.me;
    this.modal(`
      <h3 class="rounded" style="font-size:17px;font-weight:800;margin-bottom:4px">${ic('doc',16)} 契約を${iAmCoach?'提案':'依頼'}する</h3>
      <p class="hint" style="margin-bottom:14px">相手が承諾すると契約成立となります。内容はメッセージで事前にすり合わせておくとスムーズです。</p>
      <div class="field"><label>契約タイトル</label><input id="ct-title" placeholder="例：${esc(coach.sport)}個人レッスン（月4回）"></div>
      <div class="field"><label>レッスン内容・条件</label><textarea id="ct-detail" placeholder="回数・時間・場所・持ち物・キャンセル規定など"></textarea></div>
      <div class="field"><label>料金（税込）</label><input id="ct-fee" type="number" min="0" step="100" value="${iAmCoach?(this.me.fee||''):(other?.fee||'')}"></div>
      <div class="field"><label>料金単位</label><select id="ct-unit"><option value="per">1回あたり</option><option value="monthly">月額</option></select></div>
      <div class="field"><label>期間</label><input id="ct-period" placeholder="例：3ヶ月 / 1回 / 継続"></div>
      <button class="btn btn-turf btn-block" onclick="App.submitContract('${matchId}','${coach.id}','${player.id}')">この内容で送信する</button>`);
  },

  async submitContract(matchId, coachId, playerId){
    const v=id=>document.getElementById(id).value.trim();
    const title=v('ct-title'), detail=v('ct-detail'), fee=Number(v('ct-fee')), unit=v('ct-unit'), period=v('ct-period');
    if(!title||!detail||!fee||!period){ this.toast('すべての項目を入力してください'); return; }
    await DB.createContract({matchId, coach:coachId, player:playerId, proposer:this.me.id, title, detail, fee, unit, period});
    await DB.sendMessage(matchId, this.me.id, `契約の提案を送りました：「${title}」（${yen(fee)}${unit==='monthly'?'/月':'/回'}・${period}）\n契約ページからご確認ください。`);
    const partner = coachId===this.me.id?playerId:coachId;
    DB.notify(partner,'contract',`${this.me.name}さんから契約の提案が届きました`,'#contracts');
    this.closeModal(); this.toast('契約の提案を送信しました');
    this.route();
  },

  async viewContracts(){
    const cts=await DB.listContracts(this.me.id);
    const rows = await Promise.all(cts.map(async c=>{
      const other=await DB.getUser(c.coach===this.me.id?c.player:c.coach);
      const mine=c.proposer===this.me.id;
      const pays=await DB.paymentsForContract(c.id);
      let actions='';
      if(c.status==='proposed'){
        actions = mine
          ? `<button class="btn btn-sm btn-danger-soft" onclick="App.ctAction('${c.id}','cancelled')">提案を取り下げる</button>`
          : `<button class="btn btn-sm btn-turf" onclick="App.ctAction('${c.id}','active')">${ic('check',15)} 承諾して契約する</button>
             <button class="btn btn-sm btn-danger-soft" onclick="App.ctAction('${c.id}','declined')">辞退する</button>`;
      }else if(c.status==='active'){
        actions = `${this.me.id===c.player?`<button class="btn btn-sm btn-turf" onclick="App.openPay('${c.id}')">${ic('card',15)} 支払う</button>`:''}
                   <button class="btn btn-sm btn-soft" onclick="App.ctAction('${c.id}','completed')">契約を完了にする</button>
                   <button class="btn btn-sm btn-danger-soft" onclick="App.ctAction('${c.id}','cancelled')">解約する</button>`;
      }else if(c.status==='completed'){
        const done=await DB.hasReview(c.id,this.me.id);
        actions = done?`<span class="pill pill-gray">レビュー済み</span>`
          :`<button class="btn btn-sm btn-primary" onclick="App.openReview('${c.id}','${c.coach===this.me.id?c.player:c.coach}')">${ic('star',14)} レビューを書く</button>`;
      }
      return `<div class="ct-card">
        <div class="top"><h3>${esc(c.title)}</h3><span class="pill ${CT_PILL[c.status]}">${CT_STATUS[c.status]}</span></div>
        <div class="hint">相手：${esc(other?.name||'退会ユーザー')}（${c.coach===this.me.id?'受講者':'コーチ'}）</div>
        <div class="ct-meta">
          <div><div class="k">料金</div><div class="v fee" style="font-size:17px">${yen(c.fee)}<small> ${c.unit==='monthly'?'/月':'/回'}</small></div></div>
          <div><div class="k">期間</div><div class="v">${esc(c.period)}</div></div>
          <div><div class="k">提案日</div><div class="v">${fmtD(c.ts)}</div></div>
          <div><div class="k">${c.status==='active'?'成立日':'更新日'}</div><div class="v">${c.decidedTs?fmtD(c.decidedTs):'—'}</div></div>
        </div>
        <p style="font-size:13px;color:var(--ink2);white-space:pre-wrap;margin-bottom:8px">${esc(c.detail)}</p>
        ${pays.length?`<div class="hint" style="margin-bottom:8px">${ic('card',12)} 支払い ${pays.length}回・合計 ${yen(pays.reduce((s,p)=>s+p.amount,0))}（最終 ${fmtD(pays[0].ts)}）</div>`:''}
        <div class="ct-actions">${actions}
          <button class="btn btn-sm btn-ghost" onclick="location.hash='#chat/${c.matchId}'">${ic('chat',15)} トークへ</button></div>
      </div>`;
    }));
    this.shell(`
      <div class="wrap">
        <div class="page-head"><h1>契約</h1><p>提案の確認・承諾、契約中レッスンの管理ができます。</p></div>
        ${cts.length?`<div class="list">${rows.join('')}</div>`:`<div class="empty"><div class="ic">${ic('doc',44)}</div>まだ契約はありません。<br>マッチした相手とのトーク画面から契約を提案できます。</div>`}
      </div>`, 'contracts');
  },

  async ctAction(id, status){
    const labels={active:'この契約を承諾します。よろしいですか？', declined:'この提案を辞退します。よろしいですか？', completed:'この契約を完了にします。よろしいですか？', cancelled:'解約（または提案の取り下げ）を行います。よろしいですか？'};
    if(!confirm(labels[status])) return;
    const ct=await DB.updateContract(id,{status, decidedTs:Date.now()});
    const msgMap={active:'契約が成立しました！レッスン開始に向けて詳細を相談しましょう。', declined:'今回の契約提案は辞退となりました。', completed:'契約が完了しました。お疲れさまでした！', cancelled:'契約（提案）がキャンセルされました。'};
    try{ await DB.sendMessage(ct.matchId, this.me.id, msgMap[status]); }catch(e){}
    const partner = ct.coach===this.me.id?ct.player:ct.coach;
    DB.notify(partner,'contract',({active:'契約が成立しました！',declined:'契約提案は辞退されました',completed:'契約が完了しました。レビューを書きましょう',cancelled:'契約がキャンセルされました'})[status],'#contracts');
    this.toast(status==='active'?'契約が成立しました！':'更新しました');
    this.viewContracts();
  },

    this.shell(`

            <div id="me-teamfields" style="display:${u.playerType==='team'?'block':'none'}">
              <div class="field"><label>チーム名</label><input id="me-teamname" value="${esc(u.teamName||'')}"></div>
              <div class="field"><label>人数（目安）</label><input id="me-teamsize" type="number" min="2" value="${u.teamSize||''}"></div>
            </div>`:''}
          ${isCoach?`

            <div class="field"><label>指導歴</label><input id="me-exp" value="${esc(u.exp)}"></div>
            <div class="field"><label>指導形態</label><select id="me-ctarget">
              <option value="both" ${(u.coachTarget||'both')==='both'?'selected':''}>個人・チームどちらも</option>
              <option value="individual" ${u.coachTarget==='individual'?'selected':''}>個人レッスンのみ</option>
              <option value="team" ${u.coachTarget==='team'?'selected':''}>チーム指導のみ</option></select></div>

            <div class="verify-box">
              <div class="vb-t">${ic('shield',14)} コーチ認証${u.verified==='pending'?'（事務局で審査中）':''}</div>

                :`<div class="hint" style="margin-bottom:10px">本人確認書類（運転免許証・指導者資格証など）を添えて申請すると、事務局が審査のうえ「認証コーチ」バッジを付与します。認証コーチは検索で目立ち、マッチ率が上がります。</div>

                :`<div class="hint" style="margin-bottom:10px">Stripeで本人確認と口座登録を行うと、レッスン料の受取分が自動で振り込まれるようになります。未設定の間は事務局からの振込（月次精算）です。</div>

  async saveMe(){
    const v=id=>document.getElementById(id)?.value.trim();
    const patch={name:v('me-name'), sport:v('me-sport'), area:v('me-area'), intro:v('me-intro')};
    if(this.me.role==='coach'){
      patch.fee=Number(v('me-fee')||0); patch.exp=v('me-exp');
      patch.coachTarget=v('me-ctarget')||'both';
    }else{
      patch.playerType=v('me-ptype')||'individual';
      if(patch.playerType==='team'){ patch.teamName=v('me-teamname')||''; patch.teamSize=Number(v('me-teamsize')||0); }
      else{ patch.teamName=''; patch.teamSize=0; }
    }
    if(!patch.name){ this.toast('お名前を入力してください'); return; }
    this.me=await DB.updateUser(this.me.id, patch);
    this.toast('プロフィールを保存しました');
  },

  /* ---------- 通知 ---------- */
  async openNotifs(){
    const ns=await DB.listNotifications(this.me.id);
    this.modal(`
      <h3 class="rounded" style="font-size:17px;font-weight:800;margin-bottom:10px">${ic('bell',16)} 通知</h3>
      ${ns.length?ns.map(n=>`
        <div class="notif ${n.read?'':'unread'}" onclick="App.closeModal();${n.link?`location.hash='${n.link}';App.route&&App.route()`:''}">
          <div class="tx">${esc(n.text)}</div><div class="tm">${fmtT(n.ts)}</div>
        </div>`).join(''):'<p class="hint">通知はまだありません。いいねやマッチ、契約の更新があるとここに届きます。</p>'}`);
    await DB.markNotifsRead(this.me.id);
    this.updateBadges();
  },

  /* ---------- 決済 ---------- */
  async openPay(ctId){
    const cts=await DB.listContracts(this.me.id);
    const c=cts.find(x=>x.id===ctId); if(!c) return;
    const fee=Math.round(c.fee*PLATFORM_FEE_RATE), net=c.fee-fee;
    this.modal(`
      <h3 class="rounded" style="font-size:17px;font-weight:800;margin-bottom:4px">${ic('card',16)} レッスン料のお支払い</h3>
      <p class="hint">${esc(c.title)}</p>
      <div class="pay-brk">
        <div class="row"><span>レッスン料</span><span>${yen(c.fee)}${c.unit==='monthly'?' /月':' /回'}</span></div>
        <div class="row"><span>うちコーチ受取額</span><span>${yen(net)}</span></div>
        <div class="row"><span>うちサービス利用料（${Math.round(PLATFORM_FEE_RATE*100)}%）</span><span>${yen(fee)}</span></div>
        <div class="row tot"><span>お支払い合計</span><span>${yen(c.fee)}</span></div>
      </div>
      ${DB.mode==='demo'?`
        <div class="field"><label>カード番号（デモのため実際の決済は行われません）</label><input id="pay-card" inputmode="numeric" placeholder="4242 4242 4242 4242"></div>
        <div style="display:flex;gap:10px">
          <div class="field" style="flex:1"><label>有効期限</label><input id="pay-exp" placeholder="12/28"></div>
          <div class="field" style="flex:1"><label>CVC</label><input id="pay-cvc" placeholder="123"></div>
        </div>
        <button class="btn btn-turf btn-block" onclick="App.submitPay('${c.id}')">${yen(c.fee)} を支払う</button>`
      :STRIPE_CHECKOUT_ENDPOINT?`
        <button class="btn btn-turf btn-block" onclick="App.stripeCheckout('${c.id}')">Stripeで安全に支払う</button>
        <p class="hint" style="margin-top:8px">Stripeの決済ページに移動します。完了後、自動で支払いが記録されます。</p>`
      :STRIPE_PAYMENT_LINK?`
        <a class="btn btn-turf btn-block" href="${STRIPE_PAYMENT_LINK}" target="_blank" rel="noopener">Stripeで支払う（別タブ）</a>
        <button class="btn btn-soft btn-block" style="margin-top:8px" onclick="App.submitPay('${c.id}')">支払い済みとして記録する</button>`
      :`
        <button class="btn btn-turf btn-block" onclick="App.submitPay('${c.id}')">支払いを記録する（銀行振込など）</button>
        <p class="hint" style="margin-top:8px">オンライン決済は未設定です。支払いの記録のみ行われます。</p>`}
      <p class="hint" style="margin-top:10px">お支払いは契約履歴に記録され、コーチに通知されます。</p>`);
  },
  async submitPay(ctId){
    const cts=await DB.listContracts(this.me.id);
    const c=cts.find(x=>x.id===ctId); if(!c) return;
    if(DB.mode==='demo'){
      const card=(document.getElementById('pay-card')?.value||'').replace(/[^0-9]/g,'');
      if(card.length<14){ this.toast('カード番号を入力してください（デモ用のダミーで構いません）'); return; }
    }
    const fee=Math.round(c.fee*PLATFORM_FEE_RATE);
    await DB.addPayment({contractId:c.id, coach:c.coach, player:c.player, amount:c.fee, fee, net:c.fee-fee, method:DB.mode==='demo'?'demo':'manual'});
    DB.notify(c.coach,'pay',`${this.me.name}さんから ${yen(c.fee)} のお支払いがありました`,'#contracts');
    this.closeModal(); this.toast('お支払いが完了しました'); this.viewContracts();
  },

  _nav(url){ location.href=url; },
  async connectOnboard(){
    try{
      const res=await fetch(STRIPE_CONNECT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({uid:this.me.id, origin:location.origin+location.pathname})});
      const d=await res.json();
      if(d.url) this._nav(d.url); else throw new Error(d.error||'設定ページの作成に失敗しました');
    }catch(e){ this.toast(e.message||'設定ページの作成に失敗しました'); }
  },
  async stripeCheckout(ctId){
    try{
      const res=await fetch(STRIPE_CHECKOUT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contractId:ctId, uid:this.me.id, origin:location.origin+location.pathname})});
      const d=await res.json();
      if(d.url) this._nav(d.url); else throw new Error(d.error||'決済ページの作成に失敗しました');
    }catch(e){ this.toast(e.message||'決済ページの作成に失敗しました'); }
  },

  /* ---------- レビュー ---------- */
  openReview(ctId, targetId){
    this._reviewStars=5;

      <h3 class="rounded" style="font-size:17px;font-weight:800;margin-bottom:4px">${ic('star',16)} レビューを書く</h3>

    this.renderStarPick();

  renderStarPick(){
    const el=document.getElementById('star-pick'); if(!el) return;
    el.innerHTML=[1,2,3,4,5].map(i=>`<button class="${i<=this._reviewStars?'on':''}" onclick="App._reviewStars=${i};App.renderStarPick()" aria-label="星${i}">${ic('star',30)}</button>`).join('');

  /* ---------- 写真・退会・パスワード ---------- */
  pickPtype(btn){
    document.querySelectorAll('#f-ptype .seg-btn').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel'); this._ptype=btn.dataset.v;
    const tf=document.getElementById('f-teamfields'); if(tf) tf.style.display=this._ptype==='team'?'block':'none';
  },
  async applyVerify(){
    const f=document.getElementById('me-iddoc')?.files[0];
    if(!f){ this.toast('本人確認書類の画像を選択してください'); return; }
    try{
      const idDoc=await resizeImage(f,900);
      this.me=await DB.updateUser(this.me.id,{idDoc, verified:'pending', verifiedAppliedTs:Date.now()});
      this.toast('認証を申請しました。事務局の審査結果をお待ちください');
      this.viewMe();
    }catch(e){ this.toast('画像の読み込みに失敗しました'); }
  },
  async changePhoto(input){
    const f=input.files[0]; if(!f) return;
    try{
      const photo=await resizeImage(f,480);
      this.me=await DB.updateUser(this.me.id,{photo});
      this.toast('写真を更新しました'); this.viewMe();
    }catch(e){ this.toast('画像の読み込みに失敗しました'); }
  },
  async deleteMe(){
    if(!confirm('退会すると、プロフィールは非公開になりログインできなくなります。よろしいですか？')) return;
    if(!confirm('本当に退会しますか？この操作は取り消せません。')) return;
    await DB.deleteAccount(this.me.id);
    this.me=null; location.hash=''; this.route();
    this.toast('退会処理が完了しました。ご利用ありがとうございました');
  },
  openPwReset(){
    this.modal(`
      <h3 class="rounded" style="font-size:17px;font-weight:800;margin-bottom:4px">パスワードの再設定</h3>
      ${DB.mode==='demo'
        ?`<p class="hint" style="margin-bottom:14px">デモモードのため、その場で新しいパスワードを設定できます（本番ではメールで再設定リンクをお送りします）。</p>
          <div class="field"><label>登録メールアドレス</label><input id="pr-email" type="email"></div>
          <div class="field"><label>新しいパスワード（6文字以上）</label><input id="pr-pw" type="password"></div>`
        :`<p class="hint" style="margin-bottom:14px">登録メールアドレス宛に再設定用のリンクをお送りします。</p>
          <div class="field"><label>登録メールアドレス</label><input id="pr-email" type="email"></div>`}
      <button class="btn btn-primary btn-block" onclick="App.submitPwReset()">送信する</button>`);
  },
  async submitPwReset(){
    const email=document.getElementById('pr-email').value.trim();
    try{
      if(DB.mode==='demo'){
        const pw=document.getElementById('pr-pw').value;
        if(pw.length<6){ this.toast('パスワードは6文字以上で設定してください'); return; }
        await DB.resetPassword(email,pw);
        this.closeModal(); this.toast('パスワードを再設定しました。ログインしてください');
      }else{
        await DB.resetPassword(email);
        this.closeModal(); this.toast('再設定メールを送信しました。メールをご確認ください');
      }
    }catch(e){ this.toast(e.message||'エラーが発生しました'); }
  },

  /* ---------- 管理画面 ---------- */
  async viewAdmin(tab){
    if(!this.me?.isAdmin){ this.toast('管理者権限がありません'); location.hash='#browse'; return; }
    tab=tab||'dash';
    const head=`
      <div class="adm-head"><div class="wrap">
        <h1>${ic('gear',20)} MyCOACH 運営管理 <span class="pill pill-gold">ADMIN</span></h1>
        <div class="adm-tabs">
          ${[['dash','ダッシュボード'],['users','ユーザー管理'],['verify','コーチ審査'],['contracts','契約管理'],['payments','決済管理'],['reports','通報対応']].map(([k,l])=>
            `<button class="adm-tab ${tab===k?'active':''}" onclick="location.hash='#admin/${k}'">${l}${k==='reports'&&this._openReports?` (${this._openReports})`:''}${k==='verify'&&this._pendingCoaches?` (${this._pendingCoaches})`:''}</button>`).join('')}
          <button class="adm-tab" onclick="App.logout()">ログアウト</button>
        </div>
      </div></div>`;
    let body='<div class="wrap">読み込み中...</div>';
    this.shell(head+body,'admin');

    if(tab==='dash') body=await this.admDash();
    if(tab==='users') body=await this.admUsers();
    if(tab==='contracts') body=await this.admContracts();
    if(tab==='payments') body=await this.admPayments();
    if(tab==='verify') body=await this.admVerify();
    if(tab==='reports') body=await this.admReports();
    this.shell(head+body,'admin');
  },

      <div class="tbl-wrap"><table>
        <tr><th>日付</th><th>コーチ</th><th>受講者</th><th>金額</th><th>手数料</th><th>コーチ受取</th><th>方法</th></tr>
        ${ps.map(p=>`<tr><td>${fmtD(p.ts)}</td><td>${esc(us[p.coach]||'-')}</td><td>${esc(us[p.player]||'-')}</td>
          <td class="num">${yen(p.amount)}</td><td class="num">${yen(p.fee)}</td><td class="num">${yen(p.net)}</td>
          <td>${p.method==='demo'?'デモ決済':p.method==='manual'?'手動記録':'Stripe'}${p.payoutId==='stripe_connect'?'<div class="hint">自動分配済</div>':p.payoutId?'<div class="hint">精算済</div>':''}</td></tr>`).join('')||'<tr><td colspan="7">決済データがありません</td></tr>'}

  async admVerify(){
    const order={pending:0,rejected:1,none:2,approved:3};
    const coaches=(await DB.allUsers()).filter(u=>u.role==='coach')
      .sort((a,b)=>(order[a.verified||'none']??2)-(order[b.verified||'none']??2)||(b.verifiedAppliedTs||0)-(a.verifiedAppliedTs||0));
    return `<div class="wrap">
      <p class="hint" style="margin:16px 0 10px">コーチからの認証申請を審査してください。本人確認書類を確認して承認すると、プロフィールに「認証コーチ」バッジが表示されます。結果は自動でコーチに通知されます。</p>
      <div class="tbl-wrap"><table>
        <tr><th>コーチ</th><th>競技 / エリア</th><th>指導形態</th><th>申請日</th><th>書類</th><th>状態</th><th>操作</th></tr>
        ${coaches.map(u=>`<tr>
          <td><b>${esc(u.name)}</b><div class="hint">${esc(u.email)}</div></td>
          <td>${esc(u.sport)} / ${esc(u.area)}</td>
          <td>${CTARGET_S[u.coachTarget||'both']}</td>
          <td>${u.verifiedAppliedTs?fmtD(u.verifiedAppliedTs):'-'}</td>
          <td>${u.idDoc?`<button class="btn btn-sm btn-soft" onclick="App.admViewDoc('${u.id}')">書類を見る</button>`:'<span class="hint">未提出</span>'}</td>
          <td>${u.verified==='approved'?'<span class="pill pill-turf">認証済</span>'
              :u.verified==='rejected'?'<span class="pill pill-red">見送り</span>'
              :u.verified==='pending'?'<span class="pill pill-gold">審査待ち</span>'
              :'<span class="pill pill-gray">未申請</span>'}</td>
          <td><div class="tbl-actions">${
            u.verified==='pending'
              ?`<button class="btn btn-sm btn-turf" onclick="App.admVerifySet('${u.id}','approved')">承認</button>
                <button class="btn btn-sm btn-danger-soft" onclick="App.admVerifySet('${u.id}','rejected')">見送り</button>`
            :u.verified==='approved'
              ?`<button class="btn btn-sm btn-danger-soft" onclick="App.admVerifySet('${u.id}','rejected')">認証を取消</button>`
            :u.verified==='rejected'
              ?`<button class="btn btn-sm btn-turf" onclick="App.admVerifySet('${u.id}','approved')">承認する</button>`
            :'<span class="hint">申請待ち</span>'}</div></td></tr>`).join('')||'<tr><td colspan="7">コーチがいません</td></tr>'}
      </table></div></div>`;

  async admSettle(coach){
    if(!confirm('このコーチへの振込を実施済みとして精算しますか？（対象：未精算の全決済）')) return;
    const r=await DB.settleCoach(coach);
    if(!r){ this.toast('未精算の決済がありません'); return; }
    DB.notify(coach,'pay',`レッスン料 ${yen(r.amount)}（${r.count}件分）の精算・振込処理を行いました`,'#contracts');
    this.toast('精算を記録しました');
    await this.viewAdmin('payments');
  },
  async admViewDoc(userId){
    const u=await DB.getUser(userId);
    this.modal(`<h3 class="rounded" style="font-size:16px;font-weight:800;margin-bottom:10px">${esc(u.name)} さんの本人確認書類</h3>
      ${u.idDoc?`<img class="idthumb" src="${u.idDoc}" alt="本人確認書類">`:'<p class="hint">書類は提出されていません。</p>'}`);

  async admVerifySet(userId,st){
    if(!confirm(st==='approved'?'このコーチを承認します。認証バッジが付与されます。':'このコーチの審査を却下します。')) return;
    await DB.updateUser(userId,{verified:st});
    DB.notify(userId,'verify', st==='approved'?'コーチ認証が承認されました！プロフィールに認証バッジが付与されています':'コーチ認証が見送られました。本人確認書類をご確認のうえ再提出してください', '#me');
    this.toast(st==='approved'?'承認しました':'却下しました'); this.viewAdmin('verify');
  },

  async exportCSV(kind){
    let rows=[], name='';
    if(kind==='users'){
      name='mycoach_users.csv';
      rows=[['ID','名前','区分','競技','エリア','メール','料金','登録日','状態']]
        .concat((await DB.allUsers()).map(u=>[u.id,u.name,u.role,u.sport,u.area,u.email,u.fee||0,fmtD(u.createdAt||0),u.suspended?'停止':'有効']));
    }else if(kind==='contracts'){
      name='mycoach_contracts.csv';
      const us={}; (await DB.allUsers()).forEach(u=>us[u.id]=u.name);
      rows=[['ID','タイトル','コーチ','受講者','料金','単位','期間','状態','提案日']]
        .concat((await DB.allContracts()).map(c=>[c.id,c.title,us[c.coach]||'-',us[c.player]||'-',c.fee,c.unit==='monthly'?'月額':'1回',c.period,CT_STATUS[c.status],fmtD(c.ts)]));
    }else if(kind==='payments'){
      name='mycoach_payments.csv';
      const us={}; (await DB.allUsers()).forEach(u=>us[u.id]=u.name);
      rows=[['ID','日付','コーチ','受講者','金額','手数料','コーチ受取','方法','精算ID']]
        .concat((await DB.allPayments()).map(p=>[p.id,fmtD(p.ts),us[p.coach]||'-',us[p.player]||'-',p.amount,p.fee,p.net,p.method,p.payoutId||'']));
    }else{
      name='mycoach_payouts.csv';
      const us={}; (await DB.allUsers()).forEach(u=>us[u.id]=u.name);
      rows=[['ID','日付','コーチ','精算額','対象件数']]
        .concat((await DB.allPayouts()).map(p=>[p.id,fmtD(p.ts),us[p.coach]||'-',p.amount,p.count]));
    }
    const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click();
    this.toast('CSVをダウンロードしました');
  },

  /* ---------- モーダル ---------- */
  modal(html){
    this.closeModal();
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
    bg.innerHTML=`<div class="modal"><button class="close" onclick="App.closeModal()">${ic('x',16)}</button>${html}</div>`;
    bg.addEventListener('click',e=>{ if(e.target===bg) this.closeModal(); });
    document.body.appendChild(bg);
  },
  closeModal(){ document.getElementById('modal-bg')?.remove(); },
};

if(location.search.includes('paid=1')){ try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} setTimeout(()=>App.toast('お支払いが完了しました'),900); }
if(location.search.includes('connect=done')){ try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} setTimeout(()=>App.toast('口座設定を受け付けました。反映まで数分かかることがあります'),900); }
if(location.search.includes('connect=refresh')){ try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} setTimeout(()=>App.toast('口座設定が完了していません。マイページから再開できます'),900); }
App.boot();
</script>
</body>
