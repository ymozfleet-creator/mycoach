          <td>${c.status==='issued'?'<span class="pill pill-turf">発行済</span>':c.status==='revoked'?'<span class="pill pill-red">失効</span>':'<span class="pill pill-gold">申請中</span>'}</td>
          <td><div class="tbl-actions">
            ${c.status==='requested'&&u?`<button class="btn btn-sm btn-turf" onclick="App.admIssueCert('${c.id}')">発行する</button>`:''}
            ${c.status==='issued'?`<a class="btn btn-sm btn-soft" href="#cert/${c.id}">表示</a>
              <button class="btn btn-sm btn-danger-soft" onclick="App.admRevokeCert('${c.id}')">失効</button>`:''}
            ${c.status==='revoked'?`<a class="btn btn-sm btn-soft" href="#cert/${c.id}">表示</a>`:''}
          </div></td></tr>`; }).join('')||'<tr><td colspan="6">発行申請はありません</td></tr>'}
      </table></div></div>`;
  },
  async admAnnounce(){
    const ans=await DB.allAnnouncements();
    const tgt={all:'全員', coach:'コーチのみ', player:'受講者のみ'};
    return `<div class="wrap" style="max-width:860px">
      <h2 style="font-size:16px;font-weight:800;margin:18px 0 6px">${ic('megaphone',16)} お知らせを配信</h2>
      <p class="hint" style="margin-bottom:12px">配信すると対象ユーザー全員に通知（ベル）が届きます。メール通知（Trigger Email）を設定済みの場合はメールでも送信されます。</p>
      <div class="card" style="padding:18px 20px;margin-bottom:22px">
        <div class="field"><label>配信対象</label><select id="an-target">
          <option value="all">全員</option><option value="coach">コーチのみ</option><option value="player">受講者のみ</option></select></div>
        <div class="field"><label>タイトル</label><input id="an-title" placeholder="例：年末年始の運営体制について"></div>
        <div class="field"><label>本文</label><textarea id="an-body" style="min-height:110px" placeholder="お知らせの内容"></textarea></div>
        <button class="btn btn-primary" onclick="App.admSendAnnounce()">${ic('send',15)} 配信する</button>
      </div>
      <h2 style="font-size:16px;font-weight:800;margin:0 0 8px">配信履歴</h2>
      <div class="tbl-wrap"><table>
        <tr><th>日時</th><th>対象</th><th>タイトル</th><th>配信数</th></tr>
        ${ans.map(a=>`<tr><td>${fmtD(a.ts)}</td><td>${tgt[a.target]||a.target}</td>
          <td><b>${esc(a.title)}</b><div class="hint" style="white-space:pre-wrap">${esc(a.body)}</div></td>
          <td>${a.sent!=null?a.sent+'名':'-'}</td></tr>`).join('')||'<tr><td colspan="4">配信履歴はありません</td></tr>'}
      </table></div></div>`;
  },
  async admSendAnnounce(){
    const target=document.getElementById('an-target').value;
    const title=document.getElementById('an-title').value.trim();
    const body=document.getElementById('an-body').value.trim();
    if(!title||!body){ this.toast('タイトルと本文を入力してください'); return; }
    const users=(await DB.allUsers()).filter(u=>!u.deleted&&!u.suspended&&!u.isAdmin&&(target==='all'||u.role===target));
    if(!confirm(`${target==='all'?'全員':target==='coach'?'コーチ':'受講者'} ${users.length}名 に配信します。\n\n「${title}」\n\nよろしいですか？`)) return;
    await DB.addAnnouncement({title, body, target, by:this.me.name, sent:users.length});
    for(const u of users){ await DB.notify(u.id,'announce',`【お知らせ】${title}`,'#news'); }
    DB.audit({admin:this.me.name, action:'お知らせを配信', target:`${target==='all'?'全員':target==='coach'?'コーチ':'受講者'} ${users.length}名`, detail:title});
    this.toast(`${users.length}名に配信しました`);
    await this.viewAdmin('announce');
  },
  async admIssueCert(id){
    const c=await DB.getCert(id); if(!c) return;
    const u=await DB.getUser(c.userId);
    if(!u){ this.toast('ユーザーが見つかりません'); return; }
    const stats=await this._certStats(u);
    if(!confirm(`${u.name} さんの${c.type==='coach_record'?'コーチ実績証明書':'受講証明書'}を発行します。\n\n自動集計された実績：\n・成立契約 ${stats.contracts} 件（完了 ${stats.completed} 件）\n・レッスン実施 ${stats.lessons} 回\n${c.type==='coach_record'?`・評価 ${stats.ratingAvg||'-'}（${stats.ratingCount}件）／認証 ${stats.verified?'済':'未'}\n`:''}\nよろしいですか？`)) return;
    await DB.issueCert(id, stats);
    await DB.updateUser(c.userId,{certIssued:true});
    DB.audit({admin:this.me.name, action:'実績証明書を発行', target:u.name, detail:id});
    DB.notify(c.userId,'cert','実績証明書が発行されました。マイページから表示・印刷できます','#me');
    this.toast('発行しました'); await this.viewAdmin('certs');
  },
  async admRevokeCert(id){
    if(!confirm('この証明書を失効させますか？証明書ページには「失効」と表示されます。')) return;
    await DB.revokeCert(id);
    const rc=await DB.getCert(id);
    if(rc){ const still=(await DB.listMyCerts(rc.userId)).some(x=>x.status==='issued');
      if(!still) await DB.updateUser(rc.userId,{certIssued:false}); }
    DB.audit({admin:this.me.name, action:'実績証明書を失効', target:id});
    this.toast('失効させました'); await this.viewAdmin('certs');
  },
  async admSettle(coach){
    if(!confirm('このコーチへの振込を実施済みとして精算しますか？（対象：未精算の全決済）')) return;
    const r=await DB.settleCoach(coach);
    if(!r){ this.toast('未精算の決済がありません'); return; }
    const su=await DB.getUser(coach);
    DB.audit({admin:this.me.name, action:'コーチ精算', target:su?.name||coach, detail:`${yen(r.amount)}（${r.count}件）`});
    DB.notify(coach,'pay',`レッスン料 ${yen(r.amount)}（${r.count}件分）の精算・振込処理を行いました`,'#contracts');
    this.toast('精算を記録しました');
    await this.viewAdmin('payments');
  },
  async admViewDoc(userId){
    const u=await DB.getUser(userId);
    const img=safeImg(await DB.getIdDoc(userId));
    this.modal(`<h3 class="rounded" style="font-size:16px;font-weight:800;margin-bottom:10px">${esc(u.name)} さんの本人確認書類</h3>
      ${img?`<img class="idthumb" src="${img}" alt="本人確認書類">`:'<p class="hint">書類は提出されていません。</p>'}`);
  },
  async admVerifySet(userId,st){
    if(!confirm(st==='approved'?'このコーチを承認します。認証バッジが付与されます。':'このコーチの審査を却下します。')) return;
    const vu=await DB.getUser(userId);
    await DB.updateUser(userId,{verified:st});
    DB.audit({admin:this.me.name, action:st==='approved'?'コーチ認証を承認':'コーチ認証を見送り', target:vu?.name||userId});
    DB.notify(userId,'verify', st==='approved'?'コーチ認証が承認されました！プロフィールに認証バッジが付与されています':'コーチ認証が見送られました。本人確認書類をご確認のうえ再提出してください', '#me');
    this.toast(st==='approved'?'承認しました':'却下しました'); this.viewAdmin('verify');
  },

  async exportCSV(kind){
    let rows=[], name='';
    if(kind==='users'){
      name='mycoach_users.csv';
      rows=[['ID','名前','区分','競技','エリア','メール','料金','登録日','状態']]
        .concat((await DB.allUsers()).map(u=>[u.id,u.name,u.role,u.sport,u.area,u.email,u.fee||0,fmtD(u.createdAt||0),u.suspended?'停止':'有効']));
    }else if(kind==='contracts'){
      name='mycoach_contracts.csv';
      const us={}; (await DB.allUsers()).forEach(u=>us[u.id]=u.name);
      rows=[['ID','タイトル','コーチ','受講者','料金','単位','期間','状態','提案日']]
        .concat((await DB.allContracts()).map(c=>[c.id,c.title,us[c.coach]||'-',us[c.player]||'-',c.fee,c.unit==='monthly'?'月額':'1回',c.period,CT_STATUS[c.status],fmtD(c.ts)]));
    }else if(kind==='payments'){
      name='mycoach_payments.csv';
      const us={}; (await DB.allUsers()).forEach(u=>us[u.id]=u.name);
      rows=[['ID','日付','コーチ','受講者','支払総額','レッスン料','受講者手数料10%','コーチ手数料20%','コーチ受取','方法','精算ID']]
        .concat((await DB.allPayments()).map(p=>[p.id,fmtD(p.ts),us[p.coach]||'-',us[p.player]||'-',p.amount,p.base!=null?p.base:'',p.playerFee!=null?p.playerFee:'',p.coachFee!=null?p.coachFee:p.fee,p.net,p.method,p.payoutId||'']));
    }else{
      name='mycoach_payouts.csv';
      const us={}; (await DB.allUsers()).forEach(u=>us[u.id]=u.name);
      rows=[['ID','日付','コーチ','精算額','対象件数']]
        .concat((await DB.allPayouts()).map(p=>[p.id,fmtD(p.ts),us[p.coach]||'-',p.amount,p.count]));
    }
    const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click();
    this.toast('CSVをダウンロードしました');
  },

  /* ---------- モーダル ---------- */
  modal(html){
    this.closeModal();
    const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modal-bg';
    bg.innerHTML=`<div class="modal"><button class="close" onclick="App.closeModal()">${ic('x',16)}</button>${html}</div>`;
    bg.addEventListener('click',e=>{ if(e.target===bg) this.closeModal(); });
    document.body.appendChild(bg);
  },
  closeModal(){ document.getElementById('modal-bg')?.remove(); },
};

if(location.search.includes('paid=1')){ try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} setTimeout(()=>App.toast('お支払いが完了しました'),900); }
if(location.search.includes('connect=done')){ try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} setTimeout(()=>App.toast('口座設定を受け付けました。反映まで数分かかることがあります'),900); }
if(location.search.includes('connect=refresh')){ try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){} setTimeout(()=>App.toast('口座設定が完了していません。マイページから再開できます'),900); }
App.boot();
</script>
